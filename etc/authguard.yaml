# =============================================================================
#  Authguard - Envoy Gateway external URN authorization service
#
#  Canonical keys use snake_case. Container overrides use double underscores:
#  AUTHGUARD__SERVER__PORT=8081
#  AUTHGUARD__AUTH__ADMIN_TOKEN=<secret>
# =============================================================================

server:
  service_name: authguard
  host: 0.0.0.0
  port: 8080
  scope_port: 8081
  shutdown_timeout: 15s
  request:
    max_message_bytes: 1048576 # 1 MiB; extAuth normally sends headers only
    timeout: 5s
  response:
    max_message_bytes: 1048576
  performance:
    worker_threads: 2
    max_in_flight_requests: 4096

# Management traffic is exposed on a separate ClusterIP port and is not routed through the public Gateway.
mgmt:
  enabled: true
  host: 0.0.0.0
  port: 9091
  context_path: "/"
  health:
    liveness_path: "/healthz"
    readiness_path: "/readyz"
  metrics:
    enabled: true
    path: "/metrics"
  otel:
    enabled: false
    endpoint: "http://otel-collector.observability.svc:4317"
    protocol: grpc
    timeout: 5s
    sample_rate: 1.0

logging:
  mode: JSON  # HUMAN | JSON
  level: "info,tower_http=info"

auth:
  # Envoy Gateway verifies OIDC/JWT before forwarding this token to extAuth.
  identity:
    token_header: authorization
    issuer_claim: iss
    external_id_claim: sub
    # Values must be issuer-local stable group identifiers, not display names.
    groups_claim: authguard_group_ids
  # Small scopes travel directly; large scopes use a Redis-backed opaque token.
  scope_delivery:
    direct_urn_limit: 32
    max_direct_header_bytes: 8192
    context_ttl: 30s
    scope_token_ttl: 30s
  # Principal projections remain local. JIT consumes only identities already
  # verified by Envoy; federated search is control-plane only; SCIM is opt-in.
  principal_discovery:
    jit:
      enabled: true
      discovery_id: verified-oidc
      trusted_issuers: [https://idp.example.com/realms/example-corp]
      allow_insecure_http: false
    # keycloak/ldap/custom are flat sibling sections of jit/scim — all are
    # principal discovery sources. Disabled entries are ignored at startup
    # and by validation. At most ONE active provider per protocol is allowed
    # (startup rejects
    # duplicates), so a candidate is always unambiguous: every result
    # carries its source provider_id + issuer, and admin materialization
    # re-resolves it at that source before a role binding is granted.
    # Keycloak searches the Admin REST API with a confidential OAuth 2.0
    # client (client_credentials grant). The canonical `issuer` must equal
    # the OIDC `iss` verified by Envoy so `(issuer, external_id)` converges
    # with JIT/SCIM; when omitted it is derived from `base_url` + `realm`.
    # keycloak:
    #   - enabled: false
    #     discovery_id: corporate-keycloak
    #     base_url: https://sso.example.com
    #     realm: example-corp
    #     issuer: https://sso.example.com/realms/example-corp
    #     # Service account with view-users/view-groups realm-management roles.
    #     client_id: authguard-search
    #     client_secret: ""  # or client_secret_file: /run/secrets/keycloak-client-secret
    #     connect_timeout: 3s
    #     request_timeout: 5s
    #     max_page_size: 100
    #     allow_insecure_http: false
    #
    # LDAP searches through RFC-4511 with RFC-4515 filters and RFC-2696
    # paged results. Runtime query values are always RFC 4515 escaped.
    # `object_filter` is a static administrator-supplied filter, e.g.
    # `(&(objectClass=person)(cn={0}))`; `{0}` is replaced by the escaped
    # search text. Bind with a read-only service account or GSSAPI (omit
    # bind_dn/bind_password and configure a SASL mechanism via env).
    # ldap:
    #   - enabled: false
    #     discovery_id: corporate-ldap
    #     url: ldaps://ldap.example.com:636
    #     issuer: https://ldap.example.com
    #     base_dn: dc=example,dc=com
    #     bind_dn: cn=authguard-readonly,ou=service,dc=example,dc=com
    #     bind_password: ""  # or bind_password_file: /run/secrets/ldap-bind-password
    #     user:
    #       search_base: ou=people
    #       object_filter: (&(objectClass=person)(|(uid={0})(mail={0})))
    #       id_attribute: uid
    #       name_attribute: cn
    #       display_name_attribute: displayName
    #       email_attribute: mail
    #       enabled_attribute: ""  # e.g. shadowExpire or an AD userAccountControl bit
    #       search_attributes: [uid, mail]
    #     group:
    #       search_base: ou=groups
    #       object_filter: (&(objectClass=groupOfNames)(cn={0}))
    #       id_attribute: cn
    #       name_attribute: cn
    #       display_name_attribute: displayName
    #       search_attributes: [cn]
    #     connect_timeout: 3s
    #     request_timeout: 5s
    #     max_page_size: 100
    #     allow_insecure: false
    #
    # In-house identity systems (e.g. an enterprise DSP directory) integrate
    # through configurable request/response mapping plus a pre-issued bearer
    # JWT — no proprietary protocol code is needed. The `issuer` must equal
    # the OIDC `iss` verified by Envoy so projections converge with JIT.
    # custom:
    #   - enabled: false
    #     discovery_id: dsp-directory
    #     url: https://dsp.example.com/identity
    #     issuer: https://dsp.example.com
    #     # The vendor API's bearer JWT; prefer jwt_token_file from a Secret.
    #     jwt_token: ""  # or jwt_token_file: /run/secrets/dsp-jwt
    #     request:
    #       # Relative path; {{kind}} renders as user/workload/group.
    #       path: api/v1/users/{{kind}}/search
    #       text_param: search
    #       offset_param: offset
    #       limit_param: limit
    #       external_id_param: id
    #       # POST body template when the vendor API needs one; unknown
    #       # placeholders stay literal. Omit for pure query-param APIs.
    #       body_template: '{"query":"{{search}}","offset":{{offset}},"limit":{{limit}},"kind":"{{kind}}"}'
    #     response:
    #       # JSON-pointer (RFC 6901) path to the result array; empty means
    #       # the payload itself is the array.
    #       array_path: /data/items
    #       id_attr: id
    #       display_name_attr: displayName
    #       username_attr: username
    #       email_attr: email
    #       enabled_attr: active
    #       kind_attr: kind
    #     connect_timeout: 3s
    #     request_timeout: 5s
    #     max_page_size: 100
    #     allow_insecure_http: false
    #
    # The SCIM is a pull mode AuthN sync protocol, It is will ingests from (e.g, Keycloak SCIM server) provisioning the
    # Authentication data resources into Authguard storage as auth projection, so the hot AuthN path never calls the IdP.
    # Refer SCIM's specification: RFC-7643 core schema, RFC-7644 protocol.
    # https://www.rfc-editor.org/rfc/rfc7643.html
    # https://www.rfc-editor.org/rfc/rfc7644.html
    # Industry adoption: AWS IAM Identity Center automates provisioning over
    # SCIM the same way. https://docs.aws.amazon.com/singlesignon/latest/userguide/provision-automatically.html
    scim:
      enabled: false
      discovery_id: corporate-scim
      # Must exactly equal the OIDC `iss`; SCIM externalId should equal OIDC `sub`.
      issuer: https://idp.example.com/realms/example-corp
  # On every allowed check Authguard re-signs a short-lived internal business
  # JWT (RS256) carrying `authguardOrigin: true` and overwrites the
  # authorization header for the upstream microservice. The RSA private key
  # stays in Authguard (inject AUTHGUARD__AUTH__BUSINESS_TOKEN__PRIVATE_KEY
  # from a Secret); business workloads verify with the paired public key only.
  # Disabled leaves the original identity token stripped without replacement.
  business_token:
    enabled: false
    ttl: 60s
    private_key: ""  # PKCS#8 PEM RSA private key, or private_key_file: /run/secrets/...
  # Keep empty in source. Inject AUTHGUARD__AUTH__ADMIN_TOKEN from a Secret.
  admin_token: ""

storage:
  provider: SQLite
  bootstrap_policy: null
  policy_refresh_interval: 5s
  # Readiness fails when no complete policy refresh succeeds within this window.
  policy_max_staleness: 30s
  sqlite:
    url: "sqlite://authguard.db"
    max_connections: 1
    connect_timeout: 5s
  postgres:
    url: ""
    max_connections: 20
    connect_timeout: 5s

# Local development defaults to an in-process cache. Helm overrides provider
# to Redis so opaque scope tokens are shared by replicas.
cache:
  provider: Memory # Memory | Redis
  memory:
    initial_capacity: 32
    max_capacity: 65535
    ttl: 1h
    eviction_policy: LRU
  redis:
    nodes: ["redis://127.0.0.1:6379"]
    username: "default"
    password: ""
    key_prefix: authguard
    connection_timeout: 3s
    response_timeout: 6s
    # Also bounds initial connection retries while a freshly deployed cluster forms.
    retries: 8
    max_retry_wait: 65s
    min_retry_wait: 1280ms
    # Scope tokens require read-after-write consistency; keep replica reads off.
    read_from_replica: false
