# =============================================================================
#  AuthGuard shared runtime configuration
#
#  Canonical keys use snake_case. Container overrides use double underscores:
#  AUTHGUARD__SERVER__PORT=8081
#  AUTHGUARD__AUTHZ__API_TOKEN=<secret>
# =============================================================================

server:
  service_name: authguard-authz
  host: 0.0.0.0
  port: 8080
  scope_port: 8081
  shutdown_timeout: 15s
  request:
    max_message_bytes: 1048576 # 1 MiB; extAuth normally sends headers only
    timeout: 5s
  response:
    max_message_bytes: 1048576
  performance:
    worker_threads: 2
    max_in_flight_requests: 4096

logging:
  mode: JSON  # HUMAN | JSON
  level: "info,tower_http=info"

# Management traffic is exposed on a separate ClusterIP port and is not routed through the public Gateway.
mgmt:
  enabled: true
  host: 0.0.0.0
  port: 9091
  context_path: "/"
  health:
    liveness_path: "/healthz"
    readiness_path: "/readyz"
  metrics:
    enabled: true
    path: "/metrics"
  otel:
    enabled: false
    endpoint: "http://otel-collector.observability.svc:4317"
    protocol: grpc
    timeout: 5s
    sample_rate: 1.0

# Both authguard-authn and authguard-authz deserialize this one typed file.
# Each process resolves only its owned authn/authz secrets.
authn:
  # Standard OIDC example. Browser login uses Authorization Code + PKCE and
  # nonce-bound ID Token verification. Optional RFC 7662 introspection is the
  # safe path for translating a WORKLOAD bearer token; UserInfo is not an ID
  # Token and an unverified JWT payload is never accepted.
  # providers:
  #   corporate-oidc:
  #     type: oidc
  #     issuer: https://sso.example.com/realms/corporate
  #     clientId: authguard
  #     clientSecret: "${AUTHGUARD_CORPORATE_OIDC_CLIENT_SECRET}"
  #     callbackUrl: https://app.example.com/auth/v1/providers/corporate-oidc/callback
  #     scopes: [openid, profile, email]
  #     userinfo: true
  #     tokenIntrospection:
  #       endpoint: https://sso.example.com/realms/corporate/protocol/openid-connect/token/introspect
  #       acceptedAudiences: [customer-growth-job-service]
  #     identity:
  #       subject: $.sub
  #       username: $.preferred_username
  #       email: $.email
  providers: {}
  accountLinking:
    # Supported strategies:
    # - explicit (default): only authoritative Providers may create a Principal;
    #   secondary identities require an authenticated explicit-link flow.
    # - first-login: any previously unbound Provider identity may create a new
    #   Principal and identity binding. Repeated callbacks for that exact
    #   (provider, issuer, subject) resolve to the same Principal.
    # first-login is suitable for 2C signup, but it never merges identities by
    # email; linking different login methods still requires an authenticated
    # explicit-link flow.
    strategy: explicit
    authoritativeProviders: []
    allowLink: {}

authz:
  # Envoy verifies an AuthN-issued canonical token before forwarding it to
  # extAuth. AuthZ never resolves provider issuer/subject pairs.
  # An identity whose principal_id is absent from iam_principal is always
  # rejected. Authentication-only 2C routes should omit ext_authz; 2C routes
  # that need authorization use AuthN first-login to materialize the Principal.
  identity:
    token_header: authorization
    principal_id_claim: principal_id
    principal_kind_claim: principal_kind
    # Values are internal stable Group Principal IDs, not provider group names.
    groups_claim: authguard_group_ids
  # Small scopes travel directly; large scopes use a Redis-backed opaque token.
  scope_delivery:
    direct_urn_limit: 32
    max_direct_header_bytes: 8192
    context_ttl: 30s
    scope_token_ttl: 30s
  # Optional control-plane federation only. Login normalization and identity
  # binding belong to authguard-authn and never run on the AuthZ hot path.
  principal_discovery:
    # keycloak/ldap/custom are pull discovery sources. Disabled entries are
    # ignored at startup and by validation. At most ONE active provider per protocol is allowed
    # (startup rejects
    # duplicates), so a candidate is always unambiguous: every result
    # carries its source provider_id + issuer. Control-plane materialization re-resolves
    # it and requires the canonical principal_id already resolved by AuthN.
    # Keycloak searches the Admin REST API with a confidential OAuth 2.0
    # client (client_credentials grant). Keycloak is an optional external
    # integration, never a runtime dependency or default deployment.
    # keycloak:
    #   - enabled: false
    #     discovery_id: corporate-keycloak
    #     base_url: https://sso.example.com
    #     realm: example-corp
    #     issuer: https://sso.example.com/realms/example-corp
    #     # SA authentication: standard OIDC client_credentials. The SA lives
    #     # inside the realm with view-users/view-groups realm-management
    #     # roles — never a master admin. token_url overrides the well-known
    #     # Keycloak token endpoint when the IdP is fronted by a gateway.
    #     auth:
    #       token_url: ""  # default: {base_url}/realms/{realm}/protocol/openid-connect/token
    #       client_id: authguard-search
    #       client_secret: ""  # or client_secret_file: /run/secrets/keycloak-client-secret
    #     connect_timeout: 3s
    #     request_timeout: 5s
    #     max_page_size: 100
    #     allow_insecure_http: false
    #
    # LDAP searches through RFC-4511 with RFC-4515 filters and RFC-2696
    # paged results. Runtime query values are always RFC 4515 escaped.
    # `object_filter` is a static administrator-supplied filter, e.g.
    # `(&(objectClass=person)(cn={0}))`; `{0}` is replaced by the escaped
    # search text. SA authentication is a direct simple bind on every
    # connection — LDAP has no token exchange like the OIDC connectors.
    # ldap:
    #   - enabled: false
    #     discovery_id: corporate-ldap
    #     url: ldaps://ldap.example.com:636
    #     issuer: https://ldap.example.com
    #     base_dn: dc=example,dc=com
    #     auth:
    #       bind_dn: cn=authguard-readonly,ou=service,dc=example,dc=com
    #       bind_password: ""  # or bind_password_file: /run/secrets/ldap-bind-password
    #     user:
    #       search_base: ou=people
    #       object_filter: (&(objectClass=person)(|(uid={0})(mail={0})))
    #       id_attribute: uid
    #       name_attribute: cn
    #       display_name_attribute: displayName
    #       email_attribute: mail
    #       enabled_attribute: ""  # e.g. shadowExpire or an AD userAccountControl bit
    #       search_attributes: [uid, mail]
    #     group:
    #       search_base: ou=groups
    #       object_filter: (&(objectClass=groupOfNames)(cn={0}))
    #       id_attribute: cn
    #       name_attribute: cn
    #       display_name_attribute: displayName
    #       search_attributes: [cn]
    #     connect_timeout: 3s
    #     request_timeout: 5s
    #     max_page_size: 100
    #     allow_insecure: false
    #
    # In-house identity systems (e.g. an enterprise DSP directory) integrate
    # through configurable request/response mapping plus a pre-issued bearer
    # JWT for management-plane search only. Login-time proprietary protocols
    # and token translation belong to AuthN Provider adapters.
    # custom:
    #   - enabled: false
    #     discovery_id: dsp-directory
    #     url: https://dsp.example.com/identity
    #     issuer: https://dsp.example.com
    #     # The vendor API's bearer JWT; prefer jwt_token_file from a Secret.
    #     jwt_token: ""  # or jwt_token_file: /run/secrets/dsp-jwt
    #     request:
    #       # Relative path; {{kind}} renders as user/workload/group.
    #       path: api/v1/users/{{kind}}/search
    #       text_param: search
    #       offset_param: offset
    #       limit_param: limit
    #       external_id_param: id
    #       # POST body template when the vendor API needs one; unknown
    #       # placeholders stay literal. Omit for pure query-param APIs.
    #       body_template: '{"query":"{{search}}","offset":{{offset}},"limit":{{limit}},"kind":"{{kind}}"}'
    #     response:
    #       # JSON-pointer (RFC 6901) path to the result array; empty means
    #       # the payload itself is the array.
    #       array_path: /data/items
    #       id_attr: id
    #       display_name_attr: displayName
    #       username_attr: username
    #       email_attr: email
    #       enabled_attr: active
    #       kind_attr: kind
    #     connect_timeout: 3s
    #     request_timeout: 5s
    #     max_page_size: 100
    #     allow_insecure_http: false
    #
    # SCIM runs in push mode: an external sync agent authenticates at the
    # Envoy edge and provisions /scim/v2/Users or /scim/v2/Groups, which are
    # ingested into Authguard storage as principal projections, so the
    # hot AuthN path never calls the IdP. Sync-agent credentials remain in the
    # external connector deployment and are not Authguard runtime config.
    # Refer SCIM's specification: RFC-7643 core schema, RFC-7644 protocol.
    # https://www.rfc-editor.org/rfc/rfc7643.html
    # https://www.rfc-editor.org/rfc/rfc7644.html
    # Industry adoption: AWS IAM Identity Center automates provisioning over
    # SCIM the same way. https://docs.aws.amazon.com/singlesignon/latest/userguide/provision-automatically.html
    scim:
      enabled: false
      # Use the same provider ID as AuthN when SCIM externalId represents the
      # same issuer/subject; exact binding lookup then updates one Principal.
      discovery_id: corporate-scim
      # POST creates a canonical principal_id; PUT/PATCH/DELETE use the
      # server-issued id returned by the SCIM resource.
      issuer: https://idp.example.com/realms/example-corp
  # On every allowed check Authguard re-signs the verified client identity as
  # a short-lived JWT (RS256) carrying `authguardOrigin: true` and replaces
  # the authorization header for the upstream microservice. All attributes of
  # the client JWT are preserved — only the marker claim is added — so the
  # microservice verifying this signature proves the request passed through
  # Envoy Gateway and rejects clients calling its API directly. The RSA
  # private key stays in Authguard (inject the base64-encoded PKCS#8 PEM as
  # AUTHGUARD__AUTHZ__RESIGN__PRIVATE_KEY_B64); business
  # workloads verify with the paired public key only.
  # Disabled leaves the original identity token stripped without replacement.
  resign:
    enabled: false
    # Effective expiry is min(max_ttl, source canonical JWT remaining lifetime).
    max_ttl: 60s
    private_key_b64: ""
  # Keep empty in source. Inject AUTHGUARD__AUTHZ__API_TOKEN from a Secret.
  api_token: ""

storage:
  provider: SQLite
  bootstrap_policy: null
  sqlite:
    url: "sqlite://authguard.db"
    max_connections: 1
    connect_timeout: 5s
  postgres:
    # URL without credentials; username/password are separate fields so the
    # password can resolve from a secret store without leaking into the URL.
    url: ""  # e.g. postgres://host:5432/authguard
    username: ""
    password: ""  # inject AUTHGUARD__STORAGE__POSTGRES__PASSWORD from a Secret
    max_connections: 20
    min_connections: 0
    connect_timeout: 5s
    idle_timeout: 10m
    # Pings a pooled connection before handing it out (SELECT 1).
    validate_on_acquire: true

# Local development defaults to an in-process cache. Helm overrides provider
# to Redis so opaque scope tokens are shared by replicas.
cache:
  provider: Memory # Memory | Redis
  memory:
    initial_capacity: 32
    max_capacity: 65535
    ttl: 1h
    eviction_policy: LRU
  redis:
    nodes: ["redis://127.0.0.1:6379"]
    username: "default"
    password: ""
    key_prefix: authguard
    connection_timeout: 3s
    response_timeout: 6s
    # Also bounds initial connection retries while a freshly deployed cluster forms.
    retries: 8
    max_retry_wait: 65s
    min_retry_wait: 1280ms
    # Scope tokens require read-after-write consistency; keep replica reads off.
    read_from_replica: false
