{{- if and .Values.authguard.authn.enabled .Values.authguard.authn.disruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "authguard.fullname" . }}-authn
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.authguard.authn.disruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "authguard.authnSelectorLabels" . | nindent 6 }}
{{- end }}
