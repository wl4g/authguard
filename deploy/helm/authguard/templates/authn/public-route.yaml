{{/* Public AuthN API route. Exact Hosted Login routes in web/ take precedence
     over this /auth/ prefix according to Gateway API matching rules. */}}
{{- $ext := .Values.envoy_gateway.ext_authz -}}
{{- if and .Values.authguard.authn.enabled $ext.authnRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $ext.authnRoute.name }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $ext.gateway.name }}
      sectionName: http
  {{- with $ext.authnRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth/
        - path:
            type: PathPrefix
            value: /.well-known/
      backendRefs:
        - name: {{ include "authguard.fullname" . }}-authn
          port: {{ .Values.authguard.authn.service.port }}
{{- end }}
