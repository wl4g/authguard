{{- $networkPolicy := .Values.authguard.authz.networkPolicy -}}
{{- if and .Values.authguard.authz.enabled $networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "authguard.fullname" . }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "authguard.serverSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - {{- with $networkPolicy.envoyProxyNamespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          podSelector:
            matchLabels:
              {{- toYaml $networkPolicy.envoyProxyPodSelector | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.authguard.authz.service.grpcPort }} }
    - from:
        - {{- with $networkPolicy.workloadNamespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          podSelector:
            matchLabels:
              {{- toYaml $networkPolicy.workloadPodSelector | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.authguard.authz.service.scopeGrpcPort }} }
    {{- if .Values.authguard.authz.mgmt.enabled }}
    - from:
        - {{- with $networkPolicy.managementNamespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          podSelector:
            matchLabels:
              {{- toYaml $networkPolicy.managementPodSelector | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.authguard.authz.service.mgmtPort }} }
    {{- end }}
{{- end }}
{{- if and .Values.authguard.authn.enabled .Values.authguard.authz.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "authguard.fullname" . }}-authn
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "authguard.authnSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - {{- with .Values.authguard.authz.networkPolicy.envoyProxyNamespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.authguard.authz.networkPolicy.envoyProxyPodSelector | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.authguard.authn.service.port }} }
{{- end }}
