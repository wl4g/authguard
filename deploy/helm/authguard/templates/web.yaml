{{- $web := .Values.authguard.web -}}
{{- $globalThemeConfigMap := tpl (default "" .Values.global.authguard.themeConfigMap) . -}}
{{- $themeConfigMap := coalesce $web.theme.existingConfigMap $globalThemeConfigMap "" -}}
{{- if $web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "authguard.fullname" . }}-web
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "authguard.webSelectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ $web.service.port }}, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "authguard.fullname" . }}-web
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ $web.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "authguard.webSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "authguard.webSelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with $web.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: authguard-web
          image: "{{ $web.image.repository }}:{{ default .Chart.AppVersion $web.image.tag }}"
          imagePullPolicy: {{ $web.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: {{ $web.service.port }} }
          livenessProbe:
            httpGet: { path: /, port: http }
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            {{- toYaml $web.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            {{- if $themeConfigMap }}
            - { name: custom-themes, mountPath: /usr/share/nginx/html/assets/themes/custom, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        {{- if $themeConfigMap }}
        - name: custom-themes
          configMap:
            name: {{ $themeConfigMap }}
        {{- end }}
{{- $ext := .Values.envoy_gateway.ext_authz -}}
{{- if and $web.route.enabled .Values.authguard.authn.enabled $ext.gateway.create $ext.authnRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $web.route.name }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $ext.gateway.name }}
      sectionName: http
  {{- $hostnames := default $ext.authnRoute.hostnames $web.route.hostnames }}
  {{- with $hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: { type: Exact, value: /auth/login }
          method: GET
      backendRefs:
        - name: {{ include "authguard.fullname" . }}-web
          port: {{ $web.service.port }}
    - matches:
        - path: { type: Exact, value: /auth/account/security }
          method: GET
      backendRefs:
        - name: {{ include "authguard.fullname" . }}-web
          port: {{ $web.service.port }}
    - matches:
        - path: { type: PathPrefix, value: /auth/assets/ }
          method: GET
      backendRefs:
        - name: {{ include "authguard.fullname" . }}-web
          port: {{ $web.service.port }}
{{- end }}
{{- if and $web.route.console.enabled $ext.gateway.create $ext.authnRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $web.route.console.name }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $ext.gateway.name }}
      sectionName: http
  {{- with $web.route.console.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if and .Values.authguard.authz.enabled .Values.authguard.authz.mgmt.enabled }}
    - matches:
        - path: { type: PathPrefix, value: /api/ }
      backendRefs:
        - name: {{ include "authguard.fullname" . }}
          port: {{ .Values.authguard.authz.service.mgmtPort }}
    {{- end }}
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ include "authguard.fullname" . }}-web
          port: {{ $web.service.port }}
{{- end }}
{{- end }}
