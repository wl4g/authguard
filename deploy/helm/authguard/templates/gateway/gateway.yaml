{{- $envoyGateway := .Values.envoy_gateway -}}
{{- $ext := .Values.envoy_gateway.ext_authz -}}
{{- $gateway := $ext.gateway -}}
{{- $tracing := $ext.tracing -}}
{{- if $gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ $gateway.className }}
spec:
  controllerName: {{ default "gateway.envoyproxy.io/gatewayclass-controller" $gateway.controllerName }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ printf "%s-authguard" $gateway.name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          image: {{ $envoyGateway.global.images.envoyProxy.image }}
  {{- if $ext.enabled }}
  filterOrder:
    - name: envoy.filters.http.jwt_authn
      before: envoy.filters.http.ext_authz
  {{- end }}
  {{- if $tracing.enabled }}
  telemetry:
    tracing:
      provider:
        type: OpenTelemetry
        backendRefs:
          - group: ""
            kind: Service
            name: {{ required "envoy_gateway.ext_authz.tracing.backendRef.name is required when tracing is enabled" $tracing.backendRef.name | quote }}
            port: {{ required "envoy_gateway.ext_authz.tracing.backendRef.port is required when tracing is enabled" $tracing.backendRef.port }}
            {{- with $tracing.backendRef.namespace }}
            namespace: {{ . | quote }}
            {{- end }}
        {{- with $tracing.serviceName }}
        serviceName: {{ . | quote }}
        {{- end }}
        openTelemetry:
          sampler:
            type: AlwaysOn
  {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gateway.name }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ $gateway.className }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ printf "%s-authguard" $gateway.name | trunc 63 | trimSuffix "-" }}
  listeners:
    # Authentication endpoints and business routes deliberately share one
    # listener. SecurityPolicy is attached to labelled HTTPRoutes instead of
    # this listener, so Hosted Login remains same-origin and pre-auth public.
    - name: http
      protocol: HTTP
      port: {{ $gateway.listenerPort }}
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
