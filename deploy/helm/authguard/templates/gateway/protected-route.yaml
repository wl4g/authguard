{{/* Business route selected for canonical JWT validation and ext_authz. */}}
{{- $ext := .Values.envoy_gateway.ext_authz -}}
{{- $route := $ext.authguardRoute -}}
{{- if and $ext.enabled $route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $route.name }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
    authguard.io/protected: "true"
spec:
  parentRefs:
    - name: {{ $ext.gateway.name }}
      sectionName: http
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ default "/" $route.path | quote }}
      backendRefs:
        - name: {{ $route.backend.name }}
          port: {{ $route.backend.port }}
{{- end }}
