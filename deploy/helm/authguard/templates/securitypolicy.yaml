{{- $ext := .Values.envoy_gateway.ext_authz -}}
{{- $canonical := .Values.authguard.authn.canonical_jwt -}}
{{- $selector := $ext.protectedRouteSelector -}}
{{- if and $ext.enabled (not .Values.authguard.authz.enabled) }}
{{- fail "envoy_gateway.ext_authz.enabled requires authguard.authz.enabled" }}
{{- end }}
{{- if and $ext.enabled .Values.authguard.authz.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "authguard.fullname" . }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  # Only labelled business HTTPRoutes receive jwt_authn + ext_authz. AuthN and
  # Hosted Login routes stay reachable before a canonical token exists.
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      matchLabels:
        {{- toYaml $selector.matchLabels | nindent 8 }}
      namespaces:
        {{- toYaml $selector.namespaces | nindent 8 }}
  # Envoy verifies only AuthN's canonical JWT, then asks AuthZ for the resource
  # decision. External IdP protocols never execute at the edge.
  jwt:
    optional: false
    providers:
      - name: authguard-authn
        issuer: {{ required "authguard.authn.canonical_jwt.issuer is required" $canonical.issuer | quote }}
        audiences:
          {{- toYaml $canonical.audiences | nindent 10 }}
        extractFrom:
          headers:
            - name: authorization
              valuePrefix: "Bearer "
          cookies:
            - authguard_token
        {{- if $canonical.remote_jwks.uri }}
        remoteJWKS:
          uri: {{ $canonical.remote_jwks.uri | quote }}
          cacheDuration: 5m
          {{- with $canonical.remote_jwks.backend_refs }}
          backendRefs:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- else }}
        localJWKS:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: {{ include "authguard.canonicalJwksConfigMapName" . }}
        {{- end }}
  extAuth:
    failOpen: false
    timeout: 2s
    headersToExtAuth:
      - authorization
      - cookie
      - x-request-id
      - traceparent
      - tracestate
    grpc:
      backendRefs:
        - name: {{ include "authguard.fullname" . }}
          port: {{ .Values.authguard.authz.service.grpcPort }}
{{- end }}
