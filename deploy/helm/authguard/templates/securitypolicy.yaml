{{- $ext := .Values.envoy_gateway.ext_authz -}}
{{- $jwt := $ext.jwt -}}
{{- $oidc := $ext.oidc -}}
{{- if $ext.enabled }}
{{- if eq $jwt.enabled $oidc.enabled }}
{{- fail "envoy_gateway.ext_authz requires exactly one of jwt.enabled or oidc.enabled" }}
{{- end }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "authguard.fullname" . }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $ext.gateway.name }}
      sectionName: protected
  extAuth:
    failOpen: false
    timeout: 2s
    headersToExtAuth:
      {{- if $jwt.enabled }}
      - authorization
      {{- else }}
      - x-authguard-id-token
      {{- end }}
      # Correlation and W3C trace context only; identity/resource headers are
      # deliberately not accepted from the untrusted downstream request.
      - x-request-id
      - traceparent
      - tracestate
    grpc:
      backendRefs:
        - name: {{ include "authguard.fullname" . }}
          port: {{ .Values.authguard.authz.service.grpcPort }}
  {{- if $jwt.enabled }}
  jwt:
    optional: false
    providers:
      - name: platform-idp
        issuer: {{ required "envoy_gateway.ext_authz.issuer is required when jwt.enabled" $ext.issuer | quote }}
        audiences:
          {{- toYaml $jwt.audiences | nindent 10 }}
        extractFrom:
          headers:
            - name: authorization
              valuePrefix: "Bearer "
        {{- if $jwt.remoteJWKS.uri }}
        remoteJWKS:
          uri: {{ $jwt.remoteJWKS.uri | quote }}
          cacheDuration: 5m
          {{- with $jwt.remoteJWKS.backendRefs }}
          backendRefs:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- else }}
        localJWKS:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: {{ include "authguard.jwtJwksConfigMapName" . }}
        {{- end }}
      {{- range $provider := $jwt.additionalProviders }}
      - name: {{ required "envoy_gateway.ext_authz.jwt.additionalProviders[].name is required" $provider.name | quote }}
        issuer: {{ required "envoy_gateway.ext_authz.jwt.additionalProviders[].issuer is required" $provider.issuer | quote }}
        audiences:
          {{- toYaml $provider.audiences | nindent 10 }}
        extractFrom:
          headers:
            - name: authorization
              valuePrefix: "Bearer "
        localJWKS:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: {{ required "envoy_gateway.ext_authz.jwt.additionalProviders[].localJWKSConfigMap is required" $provider.localJWKSConfigMap | quote }}
      {{- end }}
  {{- end }}
  {{- if $oidc.enabled }}
  oidc:
    provider:
      issuer: {{ required "envoy_gateway.ext_authz.issuer is required when oidc.enabled" $ext.issuer | quote }}
    clientID: {{ required "envoy_gateway.ext_authz.oidc.clientID is required" $oidc.clientID | quote }}
    clientSecret:
      name: {{ required "envoy_gateway.ext_authz.oidc.clientSecretRef.name is required" $oidc.clientSecretRef.name }}
      {{- with $oidc.clientSecretRef.key }}
      key: {{ . | quote }}
      {{- end }}
    scopes: [openid, profile, email, groups]
    {{- with $oidc.redirectURL }}
    redirectURL: {{ . | quote }}
    {{- end }}
    logoutPath: /logout
    passThroughAuthHeader: true
    forwardIDToken:
      header: x-authguard-id-token
    denyRedirect:
      headers:
        - name: x-requested-with
          type: Exact
          value: XMLHttpRequest
  {{- end }}
{{- end }}
