{{- $serviceMonitor := .Values.authguard.observability.serviceMonitor -}}
{{- if and $serviceMonitor.enabled (not .Values.authguard.mgmt.enabled) -}}
{{- fail "authguard.observability.serviceMonitor requires authguard.mgmt.enabled" -}}
{{- end -}}
{{- if $serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "authguard.fullname" . }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
    {{- with $serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "authguard.serverSelectorLabels" . | nindent 6 }}
  endpoints:
    - port: mgmt
      path: {{ .Values.authguard.mgmt.metricsPath }}
      interval: {{ $serviceMonitor.interval }}
{{- end }}
