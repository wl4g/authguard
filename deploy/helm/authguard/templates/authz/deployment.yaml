{{- if .Values.authguard.authz.enabled }}
{{- $provider := include "authguard.secretsProvider" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "authguard.fullname" . }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: authz
spec:
  replicas: {{ .Values.authguard.authz.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "authguard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "authguard.runtimeConfigChecksum" . }}
        checksum/secrets: {{ .Values.secrets | toJson | sha256sum }}
        {{- if eq $provider "vault" }}
        {{- include "authguard.vaultAnnotations" . | nindent 8 }}
        {{- end }}
        {{- with .Values.authguard.authz.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "authguard.serverSelectorLabels" . | nindent 8 }}
        {{- with .Values.authguard.authz.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "authguard.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.authguard.authz.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: authguard-authz
          image: "{{ .Values.authguard.authz.image.repository }}:{{ default .Chart.AppVersion .Values.authguard.authz.image.tag }}"
          imagePullPolicy: {{ .Values.authguard.authz.image.pullPolicy }}
          args: ["--config", "/etc/authguard/authguard.yaml", "authz"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: AUTHGUARD__SERVER__DEPLOYMENT__REPLICA_COUNT
              value: {{ .Values.authguard.authz.replicaCount | quote }}
            {{- if or (eq $provider "gcp") (eq $provider "aws") }}
            - name: AUTHGUARD__SECRETS__ENV_FILE
              value: {{ include "authguard.csiSecretsMountPath" . }}/env
            {{- else if eq $provider "vault" }}
            - name: AUTHGUARD__SECRETS__ENV_FILE
              value: /vault/secrets/env
            {{- end }}
          {{- if and (eq $provider "kubernetes") .Values.secrets.kubernetes.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.kubernetes.existingSecret }}
          {{- end }}
          ports:
            - { name: authz-grpc, containerPort: {{ .Values.authguard.authz.service.grpcPort }}, protocol: TCP }
            - { name: scope-grpc, containerPort: {{ .Values.authguard.authz.service.scopeGrpcPort }}, protocol: TCP }
            {{- if .Values.authguard.authz.api.enabled }}
            - { name: api, containerPort: {{ .Values.authguard.authz.service.apiPort }}, protocol: TCP }
            {{- end }}
            {{- if .Values.authguard.mgmt.enabled }}
            - { name: mgmt, containerPort: {{ .Values.authguard.mgmt.port }}, protocol: TCP }
            {{- end }}
          {{- if .Values.authguard.mgmt.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.authguard.mgmt.livenessPath }}
              port: mgmt
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.authguard.mgmt.readinessPath }}
              port: mgmt
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: {{ .Values.authguard.mgmt.livenessPath }}
              port: mgmt
            periodSeconds: 2
            failureThreshold: 30
          {{- end }}
          resources:
            {{- toYaml .Values.authguard.authz.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/authguard
              readOnly: true
            {{- if or (eq $provider "gcp") (eq $provider "aws") }}
            - name: csi-secrets
              mountPath: {{ include "authguard.csiSecretsMountPath" . }}
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "authguard.fullname" . }}-config
        {{- if or (eq $provider "gcp") (eq $provider "aws") }}
        - name: csi-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ printf "%s-%s-secrets" (include "authguard.fullname" .) $provider }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.authguard.authz.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.authguard.authz.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.authguard.authz.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.authguard.authz.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
