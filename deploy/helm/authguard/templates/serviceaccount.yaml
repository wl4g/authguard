{{- if .Values.authguard.authz.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "authguard.serviceAccountName" . }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
  {{- with .Values.authguard.authz.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.secrets.serviceAccount.annotations }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
