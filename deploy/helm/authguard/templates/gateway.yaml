{{- $envoyGateway := .Values.envoy_gateway -}}
{{- $ext := .Values.envoy_gateway.ext_authz -}}
{{- $gateway := $ext.gateway -}}
{{- $tracing := $ext.tracing -}}
{{- if and $ext.enabled $gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ $gateway.className }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ printf "%s-authguard" $gateway.name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          image: {{ $envoyGateway.global.images.envoyProxy.image }}
  filterOrder:
    - name: envoy.filters.http.jwt_authn
      before: envoy.filters.http.ext_authz
  {{- if $tracing.enabled }}
  telemetry:
    tracing:
      provider:
        type: OpenTelemetry
        backendRefs:
          - group: ""
            kind: Service
            name: {{ required "envoy_gateway.ext_authz.tracing.backendRef.name is required when tracing is enabled" $tracing.backendRef.name | quote }}
            port: {{ required "envoy_gateway.ext_authz.tracing.backendRef.port is required when tracing is enabled" $tracing.backendRef.port }}
            {{- with $tracing.backendRef.namespace }}
            namespace: {{ . | quote }}
            {{- end }}
        {{- with $tracing.serviceName }}
        serviceName: {{ . | quote }}
        {{- end }}
        openTelemetry:
          sampler:
            type: AlwaysOn
  {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gateway.name }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ $gateway.className }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ printf "%s-authguard" $gateway.name | trunc 63 | trimSuffix "-" }}
  listeners:
    # Only this listener is protected by jwt_authn -> ext_authz. Keeping the
    # section name explicit prevents login/callback routes from inheriting the
    # business authorization policy.
    - name: protected
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    {{- if and .Values.authguard.authn.enabled $ext.authnRoute.enabled }}
    # AuthN authorize/callback traffic still enters through Envoy, but must be
    # reachable before a canonical session exists.
    - name: authn
      protocol: HTTP
      port: {{ $ext.authnRoute.listenerPort }}
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
{{- end }}
