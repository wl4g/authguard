{{- $integration := .Values.authguardIntegration -}}
{{- $route := $integration.exampleRoute -}}
{{- if and $integration.enabled $route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $route.name }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $integration.gateway.name }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $route.backend.name }}
          port: {{ $route.backend.port }}
{{- end }}
