{{- $provider := include "authguard.secretsProvider" . -}}
{{- $ext := .Values.envoy_gateway.ext_authz -}}
{{- if and $ext.enabled (eq $ext.jwt.enabled $ext.oidc.enabled) -}}
{{- fail "envoy_gateway.ext_authz requires exactly one of jwt.enabled or oidc.enabled" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "authguard.fullname" . }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.authguard.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "authguard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ .Values.secrets | toJson | sha256sum }}
        {{- if eq $provider "vault" }}
        {{- include "authguard.vaultAnnotations" . | nindent 8 }}
        {{- end }}
        {{- with .Values.authguard.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "authguard.serverSelectorLabels" . | nindent 8 }}
        {{- with .Values.authguard.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "authguard.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.authguard.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.authguard.resignKeyInit.enabled }}
      initContainers:
        # Decodes the base64 PKCS#8 PEM resign-JWT key from the injected
        # environment (or the mounted KEY=VALUE env file) into the
        # private_key_file configured under auth.resign_jwt. The runtime image
        # is distroless, so the decode runs here.
        - name: resign-key-decode
          image: "{{ .Values.authguard.resignKeyInit.image.repository }}:{{ .Values.authguard.resignKeyInit.image.tag }}"
          imagePullPolicy: {{ .Values.authguard.resignKeyInit.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: { drop: ["ALL"] }
          {{- if and (eq $provider "kubernetes") .Values.secrets.kubernetes.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.kubernetes.existingSecret }}
          {{- end }}
          command: ["sh", "-c"]
          args:
            - |
              key="${AUTHGUARD_RESIGN_JWT_PRIVATE_KEY:-}"
              if [ -z "$key" ] && [ -f /etc/authguard/csi/env ]; then
                key="$(sed -n 's/^AUTHGUARD_RESIGN_JWT_PRIVATE_KEY=//p' /etc/authguard/csi/env | head -n 1)"
              fi
              if [ -z "$key" ] && [ -f /vault/secrets/env ]; then
                key="$(sed -n 's/^AUTHGUARD_RESIGN_JWT_PRIVATE_KEY=//p' /vault/secrets/env | head -n 1)"
              fi
              if [ -n "$key" ]; then
                printf '%s' "$key" | base64 -d > /etc/authguard/secrets/resign-jwt-private-key.pem
              fi
          volumeMounts:
            - name: secrets
              mountPath: /etc/authguard/secrets
            {{- if or (eq $provider "gcp") (eq $provider "aws") }}
            - name: csi-secrets
              mountPath: {{ include "authguard.csiSecretsMountPath" . }}
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: authguard
          image: "{{ .Values.authguard.image.repository }}:{{ .Values.authguard.image.tag }}"
          imagePullPolicy: {{ .Values.authguard.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: AUTHGUARD_CONFIG_FILE
              value: /etc/authguard/authguard.yaml
            - name: AUTHGUARD_REPLICA_COUNT
              value: {{ .Values.authguard.replicaCount | quote }}
            {{- if or (eq $provider "gcp") (eq $provider "aws") }}
            - name: AUTHGUARD_ENV_FILE
              value: {{ include "authguard.csiSecretsMountPath" . }}/env
            {{- else if eq $provider "vault" }}
            - name: AUTHGUARD_ENV_FILE
              value: /vault/secrets/env
            {{- end }}
            {{- if and (index .Values "redis-cluster").enabled (index .Values "redis-cluster").usePassword }}
            - name: AUTHGUARD__CACHE__REDIS__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "authguard.redisSecretName" . }}
                  key: {{ include "authguard.redisPasswordKey" . }}
            {{- end }}
          {{- if and (eq $provider "kubernetes") .Values.secrets.kubernetes.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.kubernetes.existingSecret }}
          {{- end }}
          ports:
            - { name: authz-grpc, containerPort: {{ .Values.authguard.service.grpcPort }}, protocol: TCP }
            - { name: scope-grpc, containerPort: {{ .Values.authguard.service.scopeGrpcPort }}, protocol: TCP }
            {{- if .Values.authguard.mgmt.enabled }}
            - { name: mgmt, containerPort: {{ .Values.authguard.service.mgmtPort }}, protocol: TCP }
            {{- end }}
          {{- if .Values.authguard.mgmt.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.authguard.mgmt.livenessPath }}
              port: mgmt
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.authguard.mgmt.readinessPath }}
              port: mgmt
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: {{ .Values.authguard.mgmt.livenessPath }}
              port: mgmt
            periodSeconds: 2
            failureThreshold: 30
          {{- end }}
          resources:
            {{- toYaml .Values.authguard.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/authguard
              readOnly: true
            - name: secrets
              mountPath: /etc/authguard/secrets
            {{- if or (eq $provider "gcp") (eq $provider "aws") }}
            - name: csi-secrets
              mountPath: {{ include "authguard.csiSecretsMountPath" . }}
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "authguard.fullname" . }}-config
        - name: secrets
          emptyDir: {}
        {{- if or (eq $provider "gcp") (eq $provider "aws") }}
        - name: csi-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ printf "%s-%s-secrets" (include "authguard.fullname" .) $provider }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.authguard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.authguard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.authguard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.authguard.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
