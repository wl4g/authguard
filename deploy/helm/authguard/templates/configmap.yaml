{{- $runtimeConfig := index .Values.authguard "authguard-config" | default "" -}}
{{- if not $runtimeConfig -}}
{{- fail "authguard.authguard-config must contain the full authguard.yaml content" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "authguard.fullname" . }}-config
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
data:
  authguard.yaml: |
{{ tpl $runtimeConfig . | nindent 4 }}
