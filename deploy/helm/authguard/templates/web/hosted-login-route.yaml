{{/* Same-origin Hosted Login and immutable static assets. These exact and
     prefix matches intentionally precede AuthN's public /auth/ API prefix. */}}
{{- $web := .Values.authguard.web -}}
{{- $ext := .Values.envoy_gateway.ext_authz -}}
{{- if and $web.enabled $web.route.enabled .Values.authguard.authn.enabled $ext.authnRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $web.route.name }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $ext.gateway.name }}
      sectionName: http
  {{- $hostnames := default $ext.authnRoute.hostnames $web.route.hostnames }}
  {{- with $hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: { type: Exact, value: /auth/login }
          method: GET
      backendRefs:
        - name: {{ include "authguard.fullname" . }}-web
          port: {{ $web.service.port }}
    - matches:
        - path: { type: Exact, value: /auth/account/security }
          method: GET
      backendRefs:
        - name: {{ include "authguard.fullname" . }}-web
          port: {{ $web.service.port }}
    - matches:
        - path: { type: PathPrefix, value: /auth/assets/ }
          method: GET
      backendRefs:
        - name: {{ include "authguard.fullname" . }}-web
          port: {{ $web.service.port }}
{{- end }}
