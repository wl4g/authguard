{{- $networkPolicy := .Values.authguard.authz.networkPolicy -}}
{{- if and .Values.authguard.web.enabled $networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "authguard.fullname" . }}-web
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "authguard.webSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - {{- with $networkPolicy.envoyProxyNamespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          podSelector:
            matchLabels:
              {{- toYaml $networkPolicy.envoyProxyPodSelector | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.authguard.web.service.port }} }
{{- end }}
