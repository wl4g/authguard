{{- $integration := .Values.authguardIntegration -}}
{{- if not .Values.authguard.accessContext.existingSecret }}
{{- $secretName := include "authguard.accessContextSecretName" . -}}
{{- $secretKey := .Values.authguard.accessContext.key -}}
{{- $signingKey := .Values.authguard.accessContext.signingKey -}}
{{- if not $signingKey -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if and $existing (hasKey $existing.data $secretKey) -}}
{{- $signingKey = (index $existing.data $secretKey | b64dec) -}}
{{- else -}}
{{- $signingKey = randAlphaNum 64 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $secretKey }}: {{ $signingKey | quote }}
{{- end }}
{{- if and (not .Values.authguard.admin.existingSecret) .Values.authguard.admin.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "authguard.fullname" . }}-admin
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.authguard.admin.key }}: {{ .Values.authguard.admin.token | quote }}
{{- end }}
{{- if and $integration.enabled $integration.oidc.enabled (not $integration.oidc.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "authguard.oidcSecretName" . }}
  labels:
    {{- include "authguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ required "authguardIntegration.oidc.clientSecret is required when existingSecret is empty" $integration.oidc.clientSecret | quote }}
{{- end }}
