# Optional cluster-level Envoy Gateway controller. Disable this when the
# cluster already has a compatible Envoy Gateway installation. This block is
# passed directly to the vendored official gateway-helm chart.
envoy_gateway:
  enabled: true
  # Keep generated Kubernetes names DNS-safe even though the Helm values key
  # and dependency alias intentionally use snake_case.
  nameOverride: envoy-gateway
  global:
    images:
      envoyGateway:
        image: registry.cn-shenzhen.aliyuncs.com/wl4g/envoyproxy_gateway:v1.9.0
        pullPolicy: IfNotPresent
      envoyProxy:
        image: registry.cn-shenzhen.aliyuncs.com/wl4g/envoyproxy_envoy:distroless-v1.36.4
        pullPolicy: IfNotPresent
  deployment:
    replicas: 2
    # Resources for the control-plane container. The vendored gateway-helm
    # chart is patched so consumers set deployment.resources directly.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

# ─────────────────────────────────────────────────────────────────────
# Envoy Gateway — ext_authz integration with Authguard. Everything that
# wires the Gateway to the Authguard ext_auth gRPC endpoint lives here.
# This block is independent from envoy_gateway.enabled, so an existing
# GKE/Kubernetes Gateway can reuse the same integration without installing
# another controller.
# ─────────────────────────────────────────────────────────────────────
  ext_authz:
    enabled: true
    # External issuer verified by Envoy for the selected standard JWT/OIDC
    # integration. AuthZ still consumes only AuthN's canonical principal_id.
    issuer: https://idp.example.com/realms/example-corp
    gateway:
      create: true
      name: authguard
      className: authguard
    # Optional Envoy data-plane spans exported over OTLP/gRPC. The sampler is
    # intentionally fixed to AlwaysOn; sampling should be performed centrally.
    tracing:
      enabled: false
      backendRef:
        name: ""
        port: 4317
      # Empty uses Envoy Gateway's <gateway>.<namespace> service-name default.
      serviceName: ""
    # JWT mode: Envoy verifies Authorization: Bearer <token> against the JWKS
    # below, forwards the verified token to Authguard, and extracts the identity.
    # The public key is public information: provide localJWKS.inline (a JWKS with
    # only public keys), an existingConfigMap, or remoteJWKS.uri. jwt.enabled
    # MUST be paired with a public key — an empty JWKS cannot verify any token.
    jwt:
      enabled: true
      audiences: [customer-growth-job-service]
      # Additional trusted canonical-token issuers. Each is still verified by
      # Envoy; AuthZ receives only the normalized Principal claims.
      additionalProviders: []
      localJWKS:
        existingConfigMap: ""
        inline: '{"keys":[]}'
      remoteJWKS:
        uri: ""
        backendRefs: []
    # OIDC mode (browser users): Envoy Gateway handles the IdP redirect/callback
    # and token exchange (authorization_code); users log in on the IdP UI. The
    # forwarded ID token carries x-authguard-id-token. Workloads do NOT use this
    # flow — they authenticate with their own SA via OAuth2 client_credentials.
    oidc:
      enabled: false
      clientID: authguard
      # Existing Opaque Secret holding the OIDC client secret.
      clientSecretRef:
        name: ""
        key: client-secret
      redirectURL: ""
    # Optional HTTPRoute through the managed Gateway to a protected workload.
    authguardRoute:
      enabled: false
      name: protected-app
      hostnames: []
      backend:
        name: app
        port: 8080
    # Public pre-authentication route on a separate Gateway listener. It serves
    # only AuthN authorize/callback endpoints; business routes remain protected.
    authnRoute:
      enabled: true
      name: authguard-authn
      listenerPort: 8082
      hostnames: []

# AuthN and AuthZ deployment knobs share one product root. Runtime settings
# remain in the single authguard-config payload below.
authguard:
  # AuthN owns provider callbacks, normalization, sessions, and account linking.
  authn:
    enabled: true
    replicaCount: 2
    image:
      repository: registry.cn-shenzhen.aliyuncs.com/wl4g/authguard
      tag: "latest"
      pullPolicy: IfNotPresent
    service:
      port: 8082
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    disruptionBudget:
      enabled: true
      minAvailable: 1

  # ───────────────────────────────────────────────────────────────────
  # Authguard AuthZ — deployment parameters plus the COMPLETE shared
  # authguard.yaml, rendered with Helm tpl and mounted into both services.
  # Override it wholesale with --set-file authguard.authguard-config=....
  # Policy data remains in AuthGuard storage, outside this runtime file.
  # Secret values remain in their owning config blocks and resolve from the
  # injection mechanism selected by the top-level `secrets` block.
  # ───────────────────────────────────────────────────────────────────
  authz:
    # SQLite is the default backend, so the zero-configuration deployment is a
    # single replica. Select PostgreSQL before increasing this value.
    replicaCount: 1
    image:
      repository: registry.cn-shenzhen.aliyuncs.com/wl4g/authguard
      tag: "latest"
      pullPolicy: IfNotPresent
    imagePullSecrets: []
    # Deploy-time decoder for the resign-JWT key: the runtime image is
    # distroless, so an init container decodes AUTHGUARD_RESIGN_TOKEN_PRIVATE_KEY
    # (base64 PKCS#8 PEM) into authz.resign_token.private_key_file. Enable this
    # together with authz.resign_token.enabled inside authguard-config. busybox is
    # not mirrored in the Aliyun registry, so this defaults to mirrored alpine.
    resignKeyInit:
      enabled: false
      image:
        repository: registry.cn-shenzhen.aliyuncs.com/wl4g/alpine
        tag: "3.21"
        pullPolicy: IfNotPresent
    serviceAccount:
      create: true
      name: ""
      annotations: {}
    service:
      grpcPort: 8080
      scopeGrpcPort: 8081
      mgmtPort: 9091
    mgmt:
      enabled: true
      livenessPath: /healthz
      readinessPath: /readyz
      metricsPath: /metrics
      otelEnabled: false
      otelEndpoint: http://otel-collector.observability.svc:4317
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 1000m, memory: 512Mi }
    podAnnotations: {}
    podLabels: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    disruptionBudget:
      enabled: true
      minAvailable: 1
    networkPolicy:
      enabled: true
      # Match these selectors to the managed Envoy Proxy, protected workloads
      # resolving opaque scope tokens, and management plane. An empty namespace
      # selector means the Authguard release namespace only; set labels here only
      # when the corresponding clients live in another namespace.
      envoyProxyNamespaceSelector: {}
      envoyProxyPodSelector:
        app.kubernetes.io/name: envoy
      workloadNamespaceSelector: {}
      workloadPodSelector:
        authguard.io/scope-client: "true"
      managementNamespaceSelector: {}
      managementPodSelector:
        authguard.io/management-client: "true"
    observability:
      serviceMonitor:
        enabled: false
        interval: 30s
        labels: {}

  # The COMPLETE authguard.yaml main configuration (flowgent-chart style).
  # Helm-templated: chart values and helpers can be referenced inside, so a
  # full override stays one file.
  authguard-config: |
    server:
      service_name: authguard-authz
      host: 0.0.0.0
      port: {{ .Values.authguard.authz.service.grpcPort }}
      scope_port: {{ .Values.authguard.authz.service.scopeGrpcPort }}
      shutdown_timeout: 15s
      request:
        max_message_bytes: 1048576
        timeout: 5s
      response:
        max_message_bytes: 1048576
      performance:
        worker_threads: 2
        max_in_flight_requests: 4096
    logging:
      mode: JSON
      level: "info,tower_http=info"
    mgmt:
      enabled: {{ .Values.authguard.authz.mgmt.enabled }}
      host: 0.0.0.0
      port: {{ .Values.authguard.authz.service.mgmtPort }}
      context_path: "/"
      health:
        liveness_path: {{ .Values.authguard.authz.mgmt.livenessPath | quote }}
        readiness_path: {{ .Values.authguard.authz.mgmt.readinessPath | quote }}
      metrics:
        enabled: true
        path: {{ .Values.authguard.authz.mgmt.metricsPath | quote }}
      otel:
        enabled: {{ .Values.authguard.authz.mgmt.otelEnabled }}
        endpoint: {{ .Values.authguard.authz.mgmt.otelEndpoint | quote }}
        protocol: grpc
        timeout: 5s
        sample_rate: 1.0
    authn:
      providers: {}
      accountLinking:
        # explicit: authoritative login + authenticated explicit linking.
        # first-login: any unbound identity creates a Principal (2C signup).
        # Neither mode ever links different Providers by matching email.
        strategy: explicit
        authoritativeProviders: []
        allowLink: {}
    authz:
      # Envoy verifies AuthN's canonical token before forwarding it to AuthZ.
      # Unknown principal_id values always fail closed. Authentication-only 2C
      # routes should not attach ext_authz; authorized 2C routes use first-login.
      identity:
        token_header: {{ .Values.envoy_gateway.ext_authz.jwt.enabled | ternary "authorization" "x-authguard-id-token" }}
        principal_id_claim: principal_id
        principal_kind_claim: principal_kind
        groups_claim: authguard_group_ids
      scope_delivery:
        # Grants with at most this many URNs are delivered as a signed header
        # (direct mode); larger grants resolve through opaque scope tokens.
        direct_urn_limit: 32
        max_direct_header_bytes: 8192
        context_ttl: 30s
        scope_token_ttl: 30s
      principal_discovery:
        # Connector SA credentials resolve from the injected environment
        # ("${ENV_KEY}"); each connector authenticates BEFORE any call:
        # keycloak/scim exchange OIDC client_credentials, ldap binds directly.
        #
        # keycloak:
        #   - enabled: false
        #     discovery_id: corporate-keycloak
        #     base_url: https://sso.example.com
        #     realm: example-corp
        #     issuer: https://sso.example.com/realms/example-corp
        #     auth:
        #       token_url: ""  # default: {base_url}/realms/{realm}/protocol/openid-connect/token
        #       client_id: authguard-search
        #       client_secret: "${AUTHGUARD_KEYCLOAK_CLIENT_SECRET}"
        #     connect_timeout: 3s
        #     request_timeout: 5s
        #     max_page_size: 100
        #     allow_insecure_http: false
        # ldap:
        #   - enabled: false
        #     discovery_id: corporate-ldap
        #     url: ldaps://ldap.example.com:636
        #     issuer: https://ldap.example.com
        #     base_dn: dc=example,dc=com
        #     auth:
        #       bind_dn: cn=authguard-readonly,ou=service,dc=example,dc=com
        #       bind_password: "${AUTHGUARD_LDAP_BIND_PASSWORD}"
        #     user:
        #       search_base: ou=people
        #       object_filter: (&(objectClass=person)(|(uid={0})(mail={0})))
        #       id_attribute: uid
        #       name_attribute: cn
        #       display_name_attribute: displayName
        #       email_attribute: mail
        #       enabled_attribute: ""
        #       search_attributes: [uid, mail]
        #     group:
        #       search_base: ou=groups
        #       object_filter: (&(objectClass=groupOfNames)(cn={0}))
        #       id_attribute: cn
        #       name_attribute: cn
        #       display_name_attribute: displayName
        #       search_attributes: [cn]
        #     connect_timeout: 3s
        #     request_timeout: 5s
        #     max_page_size: 100
        #     allow_insecure: false
        # custom:
        #   - enabled: false
        #     discovery_id: dsp-directory
        #     url: https://dsp.example.com/identity
        #     issuer: https://dsp.example.com
        #     jwt_token: ""  # or jwt_token_file: /run/secrets/dsp-jwt
        #     request:
        #       # The connector resolves DOUBLE-brace tokens (kind, search,
        #       # offset, limit, external_id) at runtime. Go-escape each
        #       # brace pair so Helm tpl emits it literally instead of
        #       # consuming it as a template action.
        #       path: api/v1/users/{{ "{{" }}kind{{ "}}" }}/search
        #       text_param: search
        #       offset_param: offset
        #       limit_param: limit
        #       external_id_param: id
        #       body_template: '{"query":"{{ "{{" }}search{{ "}}" }}","offset":{{ "{{" }}offset{{ "}}" }},"limit":{{ "{{" }}limit{{ "}}" }},"kind":"{{ "{{" }}kind{{ "}}" }}"}'
        #     response:
        #       # Search responses page at array_path; resolve responses
        #       # return ONE FLAT entry with id_attr at the top level.
        #       array_path: /data/items
        #       id_attr: id
        #       display_name_attr: displayName
        #       username_attr: username
        #       email_attr: email
        #       enabled_attr: active
        #       kind_attr: kind
        #     connect_timeout: 3s
        #     request_timeout: 5s
        #     max_page_size: 100
        #     allow_insecure_http: false
        keycloak: []
        ldap: []
        custom: []
        # SCIM runs in push mode: an external connector authenticates at the
        # Envoy edge and POSTs normalized resources to
        # /api/v1/principal-discovery/scim/events, which ingests them into
        # Authguard storage as principal projections, so the hot AuthN path
        # never calls the IdP.
        scim:
          enabled: false
          discovery_id: corporate-scim
          issuer: {{ .Values.envoy_gateway.ext_authz.issuer | quote }}
      # On every allowed check Authguard re-signs the verified client identity
      # as RS256 with `authguardOrigin: true`; all client JWT attributes are
      # preserved, only the marker claim is added. The private key is decoded
      # by the resign-key-decode init container from
      # AUTHGUARD_RESIGN_TOKEN_PRIVATE_KEY (base64 PKCS#8 PEM) into the
      # private_key_file below; workloads hold only the paired public key.
      resign_token:
        enabled: false
        ttl: 60s
        private_key_file: /etc/authguard/secrets/resign-jwt-private-key.pem
      # kubernetes: overridden natively by AUTHGUARD__AUTHZ__API_TOKEN from
      # the injected environment; file-based providers resolve the reference.
      api_token: {{ if eq (include "authguard.secretsProvider" .) "kubernetes" }}""{{ else }}"${AUTHGUARD__AUTHZ__API_TOKEN}"{{ end }}
    storage:
      provider: SQLite
      bootstrap_policy: null
      sqlite:
        url: "sqlite:///tmp/authguard.db"
        max_connections: 1
        connect_timeout: 5s
      postgres:
        # URL without credentials; username/password resolve from the injected
        # environment. kubernetes: native AUTHGUARD__STORAGE__POSTGRES__*
        # overrides apply; file-based providers resolve the references.
        url: ""
        username: ""
        password: {{ if eq (include "authguard.secretsProvider" .) "kubernetes" }}""{{ else }}"${AUTHGUARD__STORAGE__POSTGRES__PASSWORD}"{{ end }}
        max_connections: 20
        min_connections: 0
        connect_timeout: 5s
        idle_timeout: 10m
        validate_on_acquire: true
    cache:
      provider: Redis
      memory:
        initial_capacity: 32
        max_capacity: 65535
        ttl: 1h
        eviction_policy: LRU
      redis:
        nodes: [{{ printf "redis://%s:6379" (include "authguard.redisFullname" .) | quote }}]
        username: default
        # In-cluster Redis consumes the Bitnami Secret directly; external
        # clusters resolve the injected environment (native override for
        # kubernetes, reference for file-based providers).
        password: {{ if eq (include "authguard.secretsProvider" .) "kubernetes" }}""{{ else }}"${AUTHGUARD_REDIS_PASSWORD}"{{ end }}
        key_prefix: authguard
        connection_timeout: 3s
        response_timeout: 6s
        retries: 8
        max_retry_wait: 65s
        min_retry_wait: 1280ms
        read_from_replica: false

# Independent optional Redis Cluster used for opaque request-access tokens.
# Only the values key/dependency alias is snake_case; generated Kubernetes
# resource names remain DNS-safe through nameOverride.
redis_cluster:
  enabled: true
  nameOverride: redis-cluster
  image:
    registry: registry.cn-shenzhen.aliyuncs.com
    repository: wl4g-k8s/bitnami_redis-cluster
    tag: "7.0.14"
    pullPolicy: IfNotPresent
  usePassword: true
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: redis-password
  cluster:
    nodes: 6
    replicas: 1
  persistence:
    enabled: false
  redis:
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { cpu: 500m, memory: 256Mi }

# ── Secrets — pick exactly ONE provider (flowgent cache.provider style) ──
# kubernetes: envFrom an existing Opaque Secret whose keys are the env names
#             used by the ${...} references above.
# gcp / aws:  a single SecretProviderClass path whose secret CONTENT is the
#             multi-line "ENV KEY=VALUE" text; mounted as a volume and read
#             through AUTHGUARD_ENV_FILE.
# vault:      the Vault Agent Injector writes the same multi-line KEY=VALUE
#             content to /vault/secrets/env.
#
# Secret contract (keys inside the Secret / KEY=VALUE content):
#   AUTHGUARD_REDIS_PASSWORD            (only when redis_cluster is external;
#                                       in-cluster uses the Bitnami Secret)
#   AUTHGUARD__STORAGE__POSTGRES__URL       (required when storage.provider=PostgreSQL)
#   AUTHGUARD__STORAGE__POSTGRES__USERNAME  (required when storage.provider=PostgreSQL)
#   AUTHGUARD__STORAGE__POSTGRES__PASSWORD  (required when storage.provider=PostgreSQL)
#   AUTHGUARD_AUTHN_SESSION_PRIVATE_KEY  (AuthN RS256 key when referenced by
#                                       authn.session.privateKey)
#   <provider-specific keys>            (AuthN client secrets referenced by
#                                       ${...} in provider entries)
#   AUTHGUARD_KEYCLOAK_CLIENT_SECRET    (keycloak connector SA)
#   AUTHGUARD_LDAP_BIND_PASSWORD        (ldap connector SA)
#   AUTHGUARD_RESIGN_TOKEN_PRIVATE_KEY    (base64 PKCS#8 PEM, required when
#                                       authz.resign_token.enabled=true)
#   AUTHGUARD__AUTHZ__API_TOKEN          (required for /api/v1 control-plane API)
#   AUTHGUARD_ACCESS_CONTEXT_HMAC_KEY   (required; shared with workloads)
secrets:
  provider: kubernetes  # kubernetes | gcp | aws | vault
  kubernetes:
    existingSecret: ""  # required when provider=kubernetes
  # GCP Secret Manager: exactly ONE path; its secret value is the
  # multi-line "ENV KEY=VALUE" content above.
  gcp:
    secretResourceName: ""  # e.g. projects/PROJECT/secrets/authguard-secrets/versions/latest
  # AWS Secrets Manager: exactly ONE secret; its value is the same
  # multi-line "ENV KEY=VALUE" content.
  aws:
    region: ""
    secretName: ""
  vault:
    vaultAddress: ""
    vaultRole: ""
    # KV v2 path whose data.env value is the multi-line KEY=VALUE content.
    secretPath: ""
  # Workload-identity annotations for the Authguard ServiceAccount, e.g.
  # iam.gke.io/gcp-service-account for the GCP CSI driver.
  serviceAccount:
    annotations: {}
