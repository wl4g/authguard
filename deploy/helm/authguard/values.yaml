# Helm propagates global values through immutable umbrella-chart dependencies.
# A business Chart can therefore attach its local-files ConfigMap without
# unpacking or rebuilding the AuthGuard tgz.
global:
  authguard:
    # Optional ConfigMap created by an umbrella/business Chart from its local
    # static files. The value is evaluated with Helm `tpl`, so a parent can use
    # `{{ .Release.Name }}-authguard-theme` without unpacking this Chart.
    themeConfigMap: ""

# Optional cluster-level Envoy Gateway controller. Disable this when the
# cluster already has a compatible Envoy Gateway installation. This block is
# passed directly to the vendored official gateway-helm chart.
envoy_gateway:
  enabled: true
  # Keep generated Kubernetes names DNS-safe even though the Helm values key
  # and dependency alias intentionally use snake_case.
  nameOverride: envoy-gateway
  global:
    images:
      envoyGateway:
        image: registry.cn-shenzhen.aliyuncs.com/wl4g/envoyproxy_gateway:v1.9.0
        pullPolicy: IfNotPresent
      envoyProxy:
        image: registry.cn-shenzhen.aliyuncs.com/wl4g/envoyproxy_envoy:distroless-v1.36.4
        pullPolicy: IfNotPresent
  deployment:
    replicas: 2
    # Resources for the control-plane container. The vendored gateway-helm
    # chart is patched so consumers set deployment.resources directly.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

# ─────────────────────────────────────────────────────────────────────
# Envoy Gateway — ext_authz integration with Authguard. Everything that
# wires the Gateway to the Authguard ext_auth gRPC endpoint lives here.
# This block is independent from envoy_gateway.enabled, so an existing
# GKE/Kubernetes Gateway can reuse the same integration without installing
# another controller.
# ─────────────────────────────────────────────────────────────────────
  ext_authz:
    enabled: true
    gateway:
      create: true
      name: authguard
      # A single listener keeps Hosted Login and the relying application on the
      # same browser origin. E2E may override this to 8082 for port-forwarding.
      listenerPort: 80
      className: authguard
      # Use a distinct controller name only when operating an isolated Envoy
      # Gateway controller (for example the disposable E2E topology).
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    # Optional Envoy data-plane spans exported over OTLP/gRPC. The sampler is
    # intentionally fixed to AlwaysOn; sampling should be performed centrally.
    tracing:
      enabled: false
      backendRef:
        name: ""
        port: 4317
      # Empty uses Envoy Gateway's <gateway>.<namespace> service-name default.
      serviceName: ""
    # Optional HTTPRoute through the managed Gateway to a protected workload.
    authguardRoute:
      enabled: false
      name: protected-app
      hostnames: []
      # Business API prefix protected by Envoy jwt_authn + ext_authz. Keep /
      # only when the entire backend, including its static Web shell, is private.
      path: /
      backend:
        name: app
        port: 8080
    # Public AuthN routes share the Gateway listener with relying applications.
    # Their more-specific HTTP path matches bypass the route-scoped PEP.
    authnRoute:
      enabled: true
      name: authguard-authn
      hostnames: []
    # Attach the PEP only to explicitly labelled business HTTPRoutes. This
    # keeps /auth/login, /auth/account/security, /auth/assets/*,
    # /.well-known/*, and /auth/* public
    # while allowing each business application to own its normal routes.
    protectedRouteSelector:
      matchLabels:
        authguard.io/protected: "true"
      namespaces:
        from: Same

# AuthN and AuthZ deployment knobs share one product root. Runtime settings
# remain in the single authguard-config payload below.
authguard:
  # Process-level diagnostics shared by AuthN and AuthZ. These endpoints are
  # internal and never routed through the public Gateway.
  mgmt:
    enabled: true
    port: 9091
    livenessPath: /healthz
    readinessPath: /readyz
    metricsPath: /metrics
    otelEnabled: false
    otelEndpoint: http://otel-collector.observability.svc:4317

  # AuthN owns provider callbacks, normalization, token issuance, and account linking.
  authn:
    enabled: true
    replicaCount: 2
    # Trusted relying applications rendered into the default authguard.yaml.
    # Umbrella Charts can configure Hosted Login without replacing the complete
    # authguard-config block.
    applications: {}
    image:
      repository: ghcr.io/wl4g/authguard
      # Empty pins the image to this chart's appVersion.
      tag: ""
      pullPolicy: IfNotPresent
    service:
      port: 8082
    # Envoy verifies only AuthN-issued canonical JWTs. External OIDC
    # discovery, callback, token exchange and ID-token validation stay in AuthN.
    canonical_jwt:
      issuer: authguard-authn
      audiences: [authguard]
      local_jwks:
        existing_config_map: ""
        inline: '{"keys":[]}'
      remote_jwks:
        uri: ""
        backend_refs: []
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    disruptionBudget:
      enabled: true
      minAvailable: 1

  # Static React Dashboard. The public Gateway still routes authentication
  # proofs to AuthN and product API calls to AuthZ; this container serves assets only.
  web:
    enabled: true
    replicaCount: 2
    imagePullSecrets: []
    image:
      repository: ghcr.io/wl4g/authguard-web
      # Empty pins the image to this chart's appVersion.
      tag: ""
      pullPolicy: IfNotPresent
    service:
      port: 8080
    theme:
      # Optional pre-created ConfigMap for standalone Chart installations.
      # Umbrella/business Charts should set global.authguard.themeConfigMap.
      existingConfigMap: ""
    route:
      enabled: true
      name: authguard-web
      # Empty inherits envoy_gateway.ext_authz.authnRoute.hostnames. This route
      # owns only /auth/login, /auth/account/security, and /auth/assets/*,
      # never an application's root.
      hostnames: []
      dashboard:
        enabled: false
        name: authguard-dashboard
        # Configure a dedicated Dashboard host; do not attach this to an
        # application's business host where / and /api belong to it.
        hostnames: []
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { cpu: 100m, memory: 64Mi }

  # ───────────────────────────────────────────────────────────────────
  # Authguard AuthZ — deployment parameters plus the COMPLETE shared
  # authguard.yaml, rendered with Helm tpl and mounted into both services.
  # Override it wholesale with --set-file authguard.authguard-config=....
  # Policy data remains in AuthGuard storage, outside this runtime file.
  # Secret values remain in their owning config blocks and resolve from the
  # injection mechanism selected by the top-level `secrets` block.
  # ───────────────────────────────────────────────────────────────────
  authz:
    # Disable for authentication-only 2C applications that do not need
    # resource-level authorization; also set envoy_gateway.ext_authz.enabled=false.
    enabled: true
    # The bundled PostgreSQL dependency is the default storage backend, so
    # AuthZ replicas share durable state. Scale this only with PostgreSQL (or
    # another shared storage provider) enabled.
    replicaCount: 1
    image:
      repository: ghcr.io/wl4g/authguard
      # Empty pins the image to this chart's appVersion.
      tag: ""
      pullPolicy: IfNotPresent
    imagePullSecrets: []
    serviceAccount:
      create: true
      name: ""
      annotations: {}
    service:
      grpcPort: 8080
      scopeGrpcPort: 8081
      apiPort: 9090
    api:
      enabled: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 1000m, memory: 512Mi }
    podAnnotations: {}
    podLabels: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    disruptionBudget:
      enabled: true
      minAvailable: 1
    networkPolicy:
      enabled: true
      # Match these selectors to the managed Envoy Proxy, protected workloads
      # resolving opaque scope tokens, and management plane. An empty namespace
      # selector means the Authguard release namespace only; set labels here only
      # when the corresponding clients live in another namespace.
      envoyProxyNamespaceSelector: {}
      envoyProxyPodSelector:
        app.kubernetes.io/name: envoy
      workloadNamespaceSelector: {}
      workloadPodSelector:
        authguard.io/scope-client: "true"
      apiNamespaceSelector: {}
      apiPodSelector:
        authguard.io/api-client: "true"
      managementNamespaceSelector: {}
      managementPodSelector:
        authguard.io/management-client: "true"
    observability:
      serviceMonitor:
        enabled: false
        interval: 30s
        labels: {}

  # The complete authguard.yaml main configuration.
  # Helm-templated: chart values and helpers can be referenced inside, so a
  # full override stays one file.
  authguard-config: |
    server:
      service_name: authguard-authz
      host: 0.0.0.0
      port: {{ .Values.authguard.authz.service.grpcPort }}
      scope_port: {{ .Values.authguard.authz.service.scopeGrpcPort }}
      shutdown_timeout: 15s
      request:
        max_message_bytes: 1048576
        timeout: 5s
      response:
        max_message_bytes: 1048576
      performance:
        worker_threads: 2
        max_in_flight_requests: 4096
      deployment:
        replica_count: 1
    secrets:
      env_file: ""
    logging:
      mode: JSON
      level: "info,tower_http=info"
    mgmt:
      enabled: {{ .Values.authguard.mgmt.enabled }}
      host: 0.0.0.0
      port: {{ .Values.authguard.mgmt.port }}
      context_path: "/"
      health:
        liveness_path: {{ .Values.authguard.mgmt.livenessPath | quote }}
        readiness_path: {{ .Values.authguard.mgmt.readinessPath | quote }}
      metrics:
        enabled: true
        path: {{ .Values.authguard.mgmt.metricsPath | quote }}
      otel:
        enabled: {{ .Values.authguard.mgmt.otelEnabled }}
        endpoint: {{ .Values.authguard.mgmt.otelEndpoint | quote }}
        protocol: grpc
        timeout: 5s
        sample_rate: 1.0
    authn:
      challengeTtl: 5m
      providers: {}
      applications: {}
      standalone:
        enabled: false
        issuer: authguard:standalone
        credentialEncryptionKey: {{ if eq (include "authguard.secretsProvider" .) "kubernetes" }}""{{ else }}"${AUTHGUARD__AUTHN__STANDALONE__CREDENTIAL_ENCRYPTION_KEY}"{{ end }}
        password:
          minLength: 12
        totp:
          enabled: false
          issuer: AuthGuard
          digits: 6
          stepSeconds: 30
          skew: 1
        webauthn:
          enabled: false
          rpId: ""
          rpOrigin: ""
          rpName: AuthGuard
      wallet:
        enabled: false
        domain: ""
        uri: ""
        statement: Sign in to AuthGuard
        rpcTimeout: 5s
        chains:
          eip155: {}
          solana: []
          bip122: {}
      accountLinking:
        # explicit: authoritative login + authenticated explicit linking.
        # first-login: any unbound identity creates a Principal (2C signup).
        # Neither mode ever links different Providers by matching email.
        strategy: explicit
        authoritativeProviders: []
        allowLink: {}
      token:
        issuer: authguard-authn
        audience: authguard
        ttl: 5m
        privateKey: ""
        privateKeyB64: {{ if eq (include "authguard.secretsProvider" .) "kubernetes" }}""{{ else }}"${AUTHGUARD__AUTHN__TOKEN__PRIVATE_KEY_B64}"{{ end }}
        privateKeyFile: ""
    authz:
      api:
        enabled: {{ .Values.authguard.authz.api.enabled }}
        host: 0.0.0.0
        port: {{ .Values.authguard.authz.service.apiPort }}
        # Kubernetes overrides this through AUTHGUARD__AUTHZ__API__TOKEN;
        # file-backed providers resolve the explicit placeholder.
        token: {{ if eq (include "authguard.secretsProvider" .) "kubernetes" }}""{{ else }}"${AUTHGUARD__AUTHZ__API__TOKEN}"{{ end }}
      # Envoy verifies AuthN's canonical token before forwarding it to AuthZ.
      # Unknown principal_id values always fail closed. Authentication-only 2C
      # routes should not attach ext_authz; authorized 2C routes use first-login.
      identity:
        token_header: authorization
        principal_id_claim: principal_id
        principal_kind_claim: principal_kind
        groups_claim: authguard_group_ids
      scope_delivery:
        # Grants with at most this many URNs are delivered as a signed header
        # (direct mode); larger grants resolve through opaque scope tokens.
        direct_urn_limit: 32
        max_direct_header_bytes: 8192
        # Kubernetes resolves this through the nested environment override;
        # file-backed providers resolve the explicit reference.
        direct_context_hmac_key: {{ if eq (include "authguard.secretsProvider" .) "kubernetes" }}""{{ else }}"${AUTHGUARD__AUTHZ__SCOPE_DELIVERY__DIRECT_CONTEXT_HMAC_KEY}"{{ end }}
        context_ttl: 30s
        scope_token_ttl: 30s
      principal_discovery:
        # Connector SA credentials resolve from the injected environment
        # ("${ENV_KEY}"). Keycloak obtains renewable client_credentials before
        # Admin API calls; LDAP binds directly.
        #
        # keycloak:
        #   - enabled: false
        #     discovery_id: corporate-keycloak
        #     base_url: https://sso.example.com
        #     realm: example-corp
        #     issuer: https://sso.example.com/realms/example-corp
        #     auth:
        #       token_url: ""  # default: {base_url}/realms/{realm}/protocol/openid-connect/token
        #       client_id: authguard-search
        #       client_secret: "${AUTHGUARD__AUTHZ__PRINCIPAL_DISCOVERY__KEYCLOAK__INDEX_0__AUTH__CLIENT_SECRET}"
        #     connect_timeout: 3s
        #     request_timeout: 5s
        #     max_page_size: 100
        #     allow_insecure_http: false
        # ldap:
        #   - enabled: false
        #     discovery_id: corporate-ldap
        #     url: ldaps://ldap.example.com:636
        #     issuer: https://ldap.example.com
        #     base_dn: dc=example,dc=com
        #     auth:
        #       bind_dn: cn=authguard-readonly,ou=service,dc=example,dc=com
        #       bind_password: "${AUTHGUARD__AUTHZ__PRINCIPAL_DISCOVERY__LDAP__INDEX_0__AUTH__BIND_PASSWORD}"
        #     user:
        #       search_base: ou=people
        #       object_filter: (&(objectClass=person)(|(uid={0})(mail={0})))
        #       id_attribute: uid
        #       name_attribute: cn
        #       display_name_attribute: displayName
        #       email_attribute: mail
        #       enabled_attribute: ""
        #       search_attributes: [uid, mail]
        #     group:
        #       search_base: ou=groups
        #       object_filter: (&(objectClass=groupOfNames)(cn={0}))
        #       id_attribute: cn
        #       name_attribute: cn
        #       display_name_attribute: displayName
        #       search_attributes: [cn]
        #     connect_timeout: 3s
        #     request_timeout: 5s
        #     max_page_size: 100
        #     allow_insecure: false
        # custom:
        #   - enabled: false
        #     discovery_id: dsp-directory
        #     url: https://dsp.example.com/identity
        #     issuer: https://dsp.example.com
        #     jwt_token: ""  # or jwt_token_file: /run/secrets/dsp-jwt
        #     request:
        #       # The connector resolves DOUBLE-brace tokens (kind, search,
        #       # offset, limit, external_id) at runtime. Go-escape each
        #       # brace pair so Helm tpl emits it literally instead of
        #       # consuming it as a template action.
        #       path: api/v1/users/{{ "{{" }}kind{{ "}}" }}/search
        #       text_param: search
        #       offset_param: offset
        #       limit_param: limit
        #       external_id_param: id
        #       body_template: '{"query":"{{ "{{" }}search{{ "}}" }}","offset":{{ "{{" }}offset{{ "}}" }},"limit":{{ "{{" }}limit{{ "}}" }},"kind":"{{ "{{" }}kind{{ "}}" }}"}'
        #     response:
        #       # Search responses page at array_path; resolve responses
        #       # return ONE FLAT entry with id_attr at the top level.
        #       array_path: /data/items
        #       id_attr: id
        #       display_name_attr: displayName
        #       username_attr: username
        #       email_attr: email
        #       enabled_attr: active
        #       kind_attr: kind
        #     connect_timeout: 3s
        #     request_timeout: 5s
        #     max_page_size: 100
        #     allow_insecure_http: false
        keycloak: []
        ldap: []
        custom: []
        # SCIM runs in push mode: an external connector authenticates at the
        # Envoy edge and provisions /scim/v2/Users or /scim/v2/Groups, which are ingested into
        # Authguard storage as principal projections, so the hot AuthN path
        # never calls the IdP.
        scim:
          enabled: false
          # Match the AuthN provider ID when externalId is its stable subject.
          discovery_id: corporate-scim
          issuer: ""
      # On every allowed check Authguard re-signs the verified client identity
      # as RS256 with `authguardOrigin: true`. The base64 PKCS#8 PEM is read
      # directly from config/environment; no key-decoding init container is
      # needed. Business workloads hold only the paired public key.
      resign:
        enabled: false
        # Never extend the incoming AuthN token: effective TTL is
        # min(max_ttl, source JWT remaining lifetime).
        max_ttl: 60s
        private_key_b64: {{ if eq (include "authguard.secretsProvider" .) "kubernetes" }}""{{ else }}"${AUTHGUARD__AUTHZ__RESIGN__PRIVATE_KEY_B64}"{{ end }}
    storage:
      provider: Postgres
      bootstrap_policy: null
      sqlite:
        url: "sqlite:///tmp/authguard.db"
        max_connections: 1
        connect_timeout: 5s
      postgres:
        # The default in-chart PostgreSQL service. Set postgresql.enabled=false
        # and override this complete runtime block for an external database.
        url: {{ printf "postgresql://%s:5432/authguard?sslmode=disable" (include "authguard.postgresqlFullname" .) | quote }}
        username: authguard
        password: {{ if eq (include "authguard.secretsProvider" .) "kubernetes" }}""{{ else }}"${AUTHGUARD__STORAGE__POSTGRES__PASSWORD}"{{ end }}
        max_connections: 20
        min_connections: 0
        connect_timeout: 5s
        idle_timeout: 10m
        validate_on_acquire: true
    cache:
      provider: Redis
      memory:
        initial_capacity: 32
        max_capacity: 65535
        ttl: 1h
        eviction_policy: LRU
      redis:
        nodes: [{{ printf "redis://%s:6379" (include "authguard.redisFullname" .) | quote }}]
        username: default
        # The in-chart Redis Cluster and AuthGuard consume the same
        # authguard-secrets key; external clusters override this block.
        password: {{ if eq (include "authguard.secretsProvider" .) "kubernetes" }}""{{ else }}"${AUTHGUARD__CACHE__REDIS__PASSWORD}"{{ end }}
        key_prefix: authguard
        connection_timeout: 3s
        response_timeout: 6s
        retries: 8
        max_retry_wait: 65s
        min_retry_wait: 1280ms
        read_from_replica: false

# Independent optional Redis Cluster used for opaque request-access tokens.
# Only the values key/dependency alias is snake_case; generated Kubernetes
# resource names remain DNS-safe through nameOverride.
redis_cluster:
  enabled: true
  nameOverride: redis-cluster
  image:
    registry: registry.cn-shenzhen.aliyuncs.com
    repository: wl4g-k8s/bitnami_redis-cluster
    tag: "7.0.14"
    pullPolicy: IfNotPresent
  usePassword: true
  password: ""
  existingSecret: authguard-secrets
  existingSecretPasswordKey: AUTHGUARD__CACHE__REDIS__PASSWORD
  cluster:
    nodes: 6
    replicas: 1
  persistence:
    enabled: false
  redis:
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { cpu: 500m, memory: 256Mi }

# Shared PostgreSQL is enabled by default so AuthN and AuthZ replicas operate
# on one IAM database. Disable it only when authguard.authguard-config points
# storage.postgres at an external service.
postgresql:
  enabled: true
  fullnameOverride: ""
  # The Bitnami chart intentionally validates non-Bitnami image names. This
  # controlled Aliyun mirror is the default for mainland-China deployments.
  global:
    security:
      allowInsecureImages: true
  image:
    registry: registry.cn-shenzhen.aliyuncs.com
    repository: wl4g/bitnami_postgresql
    tag: "18.3"
    pullPolicy: IfNotPresent
  auth:
    # AuthGuard connects through the dedicated application role; the bundled
    # database does not expose a separately configured postgres superuser.
    enablePostgresUser: false
    username: authguard
    database: authguard
    existingSecret: authguard-secrets
    secretKeys:
      # The dependency still materializes its private admin entry internally,
      # but operators manage one reflected application password key.
      adminPasswordKey: AUTHGUARD__STORAGE__POSTGRES__PASSWORD
      userPasswordKey: AUTHGUARD__STORAGE__POSTGRES__PASSWORD
  primary:
    persistence:
      enabled: true
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }

# ── Secrets — pick exactly ONE provider ──
# kubernetes: envFrom the one existing Opaque Secret, authguard-secrets, whose
#             keys are the nested environment names used by ${...} references.
# gcp / aws:  a single SecretProviderClass path whose secret CONTENT is the
#             multi-line "ENV KEY=VALUE" text; mounted as a volume and read
#             through AUTHGUARD__SECRETS__ENV_FILE.
# vault:      the Vault Agent Injector writes the same multi-line KEY=VALUE
#             content to /vault/secrets/env.
#
# The same Secret supplies the in-chart PostgreSQL and Redis credentials plus
# every optional AuthGuard secret. Use nested keys consistently, for example:
#   AUTHGUARD__STORAGE__POSTGRES__PASSWORD
#   AUTHGUARD__CACHE__REDIS__PASSWORD
#   AUTHGUARD__AUTHN__TOKEN__PRIVATE_KEY_B64
#   AUTHGUARD__AUTHN__STANDALONE__CREDENTIAL_ENCRYPTION_KEY
#   AUTHGUARD__AUTHZ__SCOPE_DELIVERY__DIRECT_CONTEXT_HMAC_KEY
#   AUTHGUARD__AUTHZ__API__TOKEN
#   AUTHGUARD__AUTHZ__RESIGN__PRIVATE_KEY_B64
# Provider and directory credentials follow their reflected config paths;
# see deploy/helm/authguard/README.md for a complete placeholder file.
secrets:
  provider: kubernetes  # kubernetes | gcp | aws | vault
  kubernetes:
    existingSecret: authguard-secrets
  # GCP Secret Manager: exactly ONE path; its secret value is the
  # multi-line "ENV KEY=VALUE" content above.
  gcp:
    secretResourceName: ""  # e.g. projects/PROJECT/secrets/authguard-secrets/versions/latest
  # AWS Secrets Manager: exactly ONE secret; its value is the same
  # multi-line "ENV KEY=VALUE" content.
  aws:
    region: ""
    secretName: ""
  vault:
    vaultRole: ""
    # KV v2 path whose data.env value is the multi-line KEY=VALUE content.
    secretPath: ""
  # Workload-identity annotations for the Authguard ServiceAccount, e.g.
  # iam.gke.io/gcp-service-account for the GCP CSI driver.
  serviceAccount:
    annotations: {}
