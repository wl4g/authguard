# Single-node Envoy data plane for the Docker topology.  It intentionally
# mirrors the Helm Gateway split: public pre-authentication traffic on :8080,
# protected application traffic on :8081.
static_resources:
  listeners:
    - name: public_authn
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: public_authn
                codec_type: AUTO
                route_config:
                  name: public_authn_routes
                  virtual_hosts:
                    - name: public
                      domains: ["*"]
                      routes:
                        - match: { path: /.well-known/authn.json }
                          route: { cluster: authn_http }
                        - match: { prefix: /auth/ }
                          route: { cluster: authn_http }
                        - match: { prefix: /api/ }
                          route: { cluster: authz_management }
                        - match: { prefix: / }
                          route: { cluster: web }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: protected
      address:
        socket_address: { address: 0.0.0.0, port_value: 8081 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: protected
                codec_type: AUTO
                route_config:
                  name: protected_routes
                  virtual_hosts:
                    - name: protected
                      domains: ["*"]
                      routes:
                        - match: { prefix: / }
                          route: { cluster: web }
                http_filters:
                  # AuthZ intentionally receives a JWT already verified by the
                  # edge. `forward` retains the bearer header for its trusted
                  # canonical-Principal claim extraction.
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        authguard_authn:
                          issuer: authguard-authn
                          audiences: [authguard]
                          from_headers:
                            - name: authorization
                              value_prefix: "Bearer "
                          forward: true
                          remote_jwks:
                            http_uri:
                              uri: http://authn/.well-known/jwks.json
                              cluster: authn_http
                              timeout: 2s
                            cache_duration: 300s
                      rules:
                        - match: { prefix: / }
                          requires: { provider_name: authguard_authn }
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      failure_mode_allow: false
                      transport_api_version: V3
                      grpc_service:
                        envoy_grpc: { cluster_name: authz_grpc }
                        timeout: 2s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: authn_http
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: authn_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: authn, port_value: 8082 }
    - name: authz_management
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: authz_management
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: authz, port_value: 9091 }
    - name: authz_grpc
      type: STRICT_DNS
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: authz_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: authz, port_value: 8080 }
    - name: web
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: web
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: web, port_value: 8080 }
