# Single-node Envoy data plane for the Docker topology. It mirrors the Helm
# deployment's one same-origin listener: public AuthN/UI paths bypass PEP while
# the business catch-all route enforces jwt_authn -> ext_authz.
static_resources:
  listeners:
    - name: edge
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge
                codec_type: AUTO
                route_config:
                  name: edge_routes
                  virtual_hosts:
                    - name: public
                      domains: ["*"]
                      routes:
                        - match:
                            path: /auth/login
                            headers:
                              - name: ":method"
                                string_match: { exact: GET }
                          route: { cluster: web }
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match:
                            path: /auth/account/security
                            headers:
                              - name: ":method"
                                string_match: { exact: GET }
                          route: { cluster: web }
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: /auth/assets/ }
                          route: { cluster: web }
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: /.well-known/ }
                          route: { cluster: authn_http }
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: /auth/ }
                          route: { cluster: authn_http }
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: /api/ }
                          route: { cluster: authz_api }
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: / }
                          route: { cluster: web }
                http_filters:
                  # AuthZ receives only a Gateway-verified canonical JWT. The
                  # browser transport is the same HttpOnly cookie as Helm.
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        authguard_authn:
                          issuer: authguard-authn
                          audiences: [authguard]
                          from_headers:
                            - name: authorization
                              value_prefix: "Bearer "
                          from_cookies: [authguard_token]
                          forward: true
                          remote_jwks:
                            http_uri:
                              uri: http://authn/.well-known/jwks.json
                              cluster: authn_http
                              timeout: 2s
                            cache_duration: 300s
                      rules:
                        - match: { prefix: / }
                          requires: { provider_name: authguard_authn }
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      failure_mode_allow: false
                      transport_api_version: V3
                      grpc_service:
                        envoy_grpc: { cluster_name: authz_grpc }
                        timeout: 2s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: authn_http
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: authn_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: authn, port_value: 8082 }
    - name: authz_api
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: authz_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: authz, port_value: 9090 }
    - name: authz_grpc
      type: STRICT_DNS
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: authz_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: authz, port_value: 8080 }
    - name: web
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: web
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: web, port_value: 8080 }
