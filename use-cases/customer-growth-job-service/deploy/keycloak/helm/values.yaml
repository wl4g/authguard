support:
  enabled: true
keycloak:
  image: ''
  pullPolicy: IfNotPresent
  realm: ''
  bootstrapAdminUsername: e2e-authguard-admin
  bootstrapAdminPassword: e2e-authguard-admin-password
  realmSigningPrivateKey: ''
  realmSigningCertificate: ''
  realmSigningJwks: ''
  resignJwtPrivateKey: ''
  resignJwtPublicKey: ''
  workloadClientSecret: e2e-authguard-workload-client-secret
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  tracingEnabled: true
