[workspace]

[package]
name = "authguard-customer-growth-job-rust-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.91"

[[test]]
name = "customer_growth_job_e2e"
path = "../../../verifier/sdk/s22_sqlx.rs"

[dependencies]
anyhow = "1.0"
authguard-adapter-rust = { path = "../../../../../src/adapters/rust" }
authguard-common = { path = "../../../../../src/common" }
axum = "0.8"
base64 = "0.22"
http = "1.2"
rsa = { version = "0.9", features = ["pem", "sha2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "postgres", "sqlite"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
