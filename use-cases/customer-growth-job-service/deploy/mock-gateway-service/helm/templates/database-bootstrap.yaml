{{- if .Values.support.enabled }}
{{- $name := include "customer-growth-e2e.postgresqlName" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-seed-data
  labels:
    {{- include "customer-growth-e2e.labels" . | nindent 4 }}
data:
  init.sql: |
{{ required "databaseBootstrap.initSQL must contain the shared database seed data" .Values.databaseBootstrap.initSQL | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-credentials
  labels:
    {{- include "customer-growth-e2e.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-username: {{ .Values.databaseBootstrap.adminUsername | quote }}
  admin-password: {{ .Values.databaseBootstrap.adminPassword | quote }}
  superuser-password: {{ .Values.databaseBootstrap.superuserPassword | quote }}
  authguard-username: {{ .Values.databaseBootstrap.authguardUsername | quote }}
  authguard-password: {{ .Values.databaseBootstrap.authguardPassword | quote }}
  authguard-schema: {{ .Values.databaseBootstrap.authguardSchema | quote }}
  {{- range $component, $workload := .Values.workloads }}
  {{ $component }}-username: {{ $workload.databaseUsername | quote }}
  {{ $component }}-password: {{ $workload.databasePassword | quote }}
  {{ $component }}-schema: {{ $workload.schema | quote }}
  {{- if hasPrefix "spring-" $component }}
  {{ $component }}-url: {{ printf "jdbc:postgresql://%s.%s.svc.cluster.local:5432/%s?sslmode=disable&currentSchema=%s" $name $.Release.Namespace $.Values.databaseBootstrap.database $workload.schema | quote }}
  {{- else }}
  {{ $component }}-url: {{ printf "postgresql://%s:%s@%s.%s.svc.cluster.local:5432/%s?sslmode=disable&options=-csearch_path%%3D%s" $workload.databaseUsername $workload.databasePassword $name $.Release.Namespace $.Values.databaseBootstrap.database $workload.schema | quote }}
  {{- end }}
  {{- end }}
  10-e2e-authguard-init.sh: |
    #!/bin/bash
    set -euo pipefail
    export PGPASSWORD="${POSTGRESQL_POSTGRES_PASSWORD}"
    psql --host=127.0.0.1 --username=postgres --dbname="${POSTGRESQL_DATABASE}" \
      --set=ON_ERROR_STOP=1 \
      --set=role_name={{ .Values.databaseBootstrap.authguardUsername | quote }} \
      --set=role_password={{ .Values.databaseBootstrap.authguardPassword | quote }} \
      --set=schema_name={{ .Values.databaseBootstrap.authguardSchema | quote }} <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'role_name', :'role_password')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role_name') \gexec
    SELECT format('ALTER ROLE %I PASSWORD %L', :'role_name', :'role_password') \gexec
    SELECT format('CREATE SCHEMA IF NOT EXISTS %I AUTHORIZATION %I', :'schema_name', :'role_name') \gexec
    SELECT format('ALTER ROLE %I IN DATABASE %I SET search_path = %I', :'role_name', current_database(), :'schema_name') \gexec
    SQL
    {{- range $component, $workload := .Values.workloads }}
    psql --host=127.0.0.1 --username=postgres --dbname="${POSTGRESQL_DATABASE}" \
      --set=ON_ERROR_STOP=1 \
      --set=role_name={{ $workload.databaseUsername | quote }} \
      --set=role_password={{ $workload.databasePassword | quote }} \
      --set=schema_name={{ $workload.schema | quote }} <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'role_name', :'role_password')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role_name') \gexec
    SELECT format('ALTER ROLE %I PASSWORD %L', :'role_name', :'role_password') \gexec
    SELECT format('CREATE SCHEMA IF NOT EXISTS %I AUTHORIZATION %I', :'schema_name', :'role_name') \gexec
    SELECT format('ALTER ROLE %I IN DATABASE %I SET search_path = %I', :'role_name', current_database(), :'schema_name') \gexec
    SQL
    PGPASSWORD={{ $workload.databasePassword | quote }} PGOPTIONS={{ printf "-c search_path=%s" $workload.schema | quote }} \
      psql --host=127.0.0.1 --username={{ $workload.databaseUsername | quote }} \
      --dbname="${POSTGRESQL_DATABASE}" --set=ON_ERROR_STOP=1 --file=/e2e-seed/init.sql
    {{- end }}
{{- end }}
