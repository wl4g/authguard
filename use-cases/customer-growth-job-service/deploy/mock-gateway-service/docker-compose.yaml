services:
  authz:
    image: ${AUTHGUARD_E2E_AUTHGUARD_IMAGE:?use util/images.py}
    volumes:
    - ${AUTHGUARD_E2E_RUNTIME_DIR}/authguard.yaml:/etc/authguard/authguard.yaml:ro
    tmpfs: &id001
    - /tmp
    command:
    - --config
    - /etc/authguard/authguard.yaml
    - authz
    environment:
      AUTHGUARD__SERVER__SERVICE_NAME: authguard-authz
      AUTHGUARD__MGMT__OTEL__ENDPOINT: http://jaeger:4317
    ports:
    - 127.0.0.1::8080
    - 127.0.0.1::8081
    - 127.0.0.1::9090
    - 127.0.0.1::${AUTHGUARD_E2E_MGMT_PORT:-9091}
    platform: ${AUTHGUARD_E2E_PLATFORM:-linux/amd64}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        RUST_BUILDER_IMAGE: ${RUST_BUILDER_IMAGE:?use util/images.py}
        DEBIAN_IMAGE: ${DEBIAN_IMAGE:?use util/images.py}
        AUTHGUARD_CARGO_FEATURES: web3
    depends_on: &id002
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      ldap:
        condition: service_started
      jaeger:
        condition: service_started
      mock-idp:
        condition: service_started
      anvil:
        condition: service_started
      solana:
        condition: service_started
  authn:
    image: ${AUTHGUARD_E2E_AUTHGUARD_IMAGE:?use util/images.py}
    volumes:
    - ${AUTHGUARD_E2E_RUNTIME_DIR}/authguard.yaml:/etc/authguard/authguard.yaml:ro
    tmpfs: *id001
    command:
    - --config
    - /etc/authguard/authguard.yaml
    - authn
    - --bind
    - 0.0.0.0:8082
    environment:
      AUTHGUARD__SERVER__SERVICE_NAME: authguard-authn
      AUTHGUARD__MGMT__OTEL__ENDPOINT: http://jaeger:4317
    ports:
    - 127.0.0.1::8082
    - 127.0.0.1::${AUTHGUARD_E2E_MGMT_PORT:-9091}
    platform: ${AUTHGUARD_E2E_PLATFORM:-linux/amd64}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        RUST_BUILDER_IMAGE: ${RUST_BUILDER_IMAGE:?use util/images.py}
        DEBIAN_IMAGE: ${DEBIAN_IMAGE:?use util/images.py}
        AUTHGUARD_CARGO_FEATURES: web3
    depends_on: *id002
  web:
    image: ${AUTHGUARD_E2E_WEB_IMAGE:?use util/images.py}
    volumes:
    - ../../use-cases/customer-growth-job-service/deploy/mock-gateway-service/helm/files/authguard-theme:/usr/share/nginx/html/assets/themes/custom:ro
    ports:
    - 127.0.0.1::8080
    platform: ${AUTHGUARD_E2E_PLATFORM:-linux/amd64}
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:?use util/images.py}
        WEB_IMAGE: ${WEB_IMAGE:?use util/images.py}
  postgresql:
    image: ${AUTHGUARD_E2E_POSTGRES_IMAGE:?use util/images.py}
    environment:
      POSTGRESQL_USERNAME: e2e_authguard_customer_growth_admin
      POSTGRESQL_PASSWORD: e2e-authguard-customer-growth-admin-password
      POSTGRESQL_POSTGRES_PASSWORD: e2e-authguard-customer-growth-postgres-password
      POSTGRESQL_DATABASE: e2e_authguard_customer_growth
    volumes:
    - ${AUTHGUARD_E2E_RUNTIME_DIR}/postgres-init.sh:/docker-entrypoint-initdb.d/10-e2e-authguard-init.sh:ro
    - ../../use-cases/customer-growth-job-service/deploy/mock-gateway-service/config/init.sql:/e2e-seed/init.sql:ro
    ports:
    - 127.0.0.1::5432
    platform: ${AUTHGUARD_E2E_PLATFORM:-linux/amd64}
  redis:
    image: ${AUTHGUARD_E2E_REDIS_IMAGE:?use util/images.py}
    ports:
    - 127.0.0.1::6379
    platform: ${AUTHGUARD_E2E_PLATFORM:-linux/amd64}
  jaeger:
    image: ${AUTHGUARD_E2E_JAEGER_IMAGE:?use util/images.py}
    ports:
    - 127.0.0.1::4317
    - 127.0.0.1::4318
    - 127.0.0.1::16686
    platform: ${AUTHGUARD_E2E_PLATFORM:-linux/amd64}
  envoy:
    image: ${AUTHGUARD_E2E_ENVOY_IMAGE:?use util/images.py}
    ports:
    - 127.0.0.1::19000
    platform: ${AUTHGUARD_E2E_PLATFORM:-linux/amd64}
    depends_on:
      authn:
        condition: service_started
      authz:
        condition: service_started
      web:
        condition: service_started
      go-sqlx:
        condition: service_started
      rust-sqlx:
        condition: service_started
      python-sqlalchemy:
        condition: service_started
      spring-jdbc:
        condition: service_started
      spring-jpa:
        condition: service_started
