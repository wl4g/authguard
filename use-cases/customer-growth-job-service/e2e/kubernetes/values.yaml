keycloak:
  image: registry.cn-shenzhen.aliyuncs.com/wl4g/keycloak:26.7.0
  pullPolicy: IfNotPresent
  realm: ""
  bootstrapAdminUsername: e2e-admin
  bootstrapAdminPassword: e2e-admin-password
  # SCIM v2 API is a preview feature in Keycloak 26; the sync agent needs a
  # confidential client carrying the SCIM audience and a realm-admin SA.
  scimEnabled: true
  # Static e2e_ keys passed as --set-file by the runner; empty values fail
  # chart rendering, so a missing --set-file cannot silently deploy a dynamic
  # realm key.
  realmSigningPrivateKey: ""
  realmSigningCertificate: ""
  realmSigningJwks: ""
  resignJwtPrivateKey: ""
  resignJwtPublicKey: ""
  # Business SA secret for the workload client_credentials verifier.
  workloadClientSecret: e2e-workload-client-secret
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: 1000m, memory: 1Gi }

ldap:
  enabled: true
  image: registry.cn-shenzhen.aliyuncs.com/wl4g/glauth:v2.5.0
  pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

jaeger:
  enabled: true
  image: registry.cn-shenzhen.aliyuncs.com/wl4g/jaegertracing_all-in-one:1.76.0
  pullPolicy: IfNotPresent
  memoryMaxTraces: 10000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

postgresql:
  image: registry.cn-shenzhen.aliyuncs.com/wl4g/bitnami_postgresql:18.3
  pullPolicy: IfNotPresent
  database: e2e_customer_growth
  adminUsername: e2e_customer_growth_admin
  adminPassword: e2e-customer-growth-admin-password
  superuserPassword: e2e-customer-growth-postgres-password
  initSQL: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }

gateway:
  name: e2e-customer-growth-gateway

# Mock in-house identity directory consumed by the CustomPrincipalDiscovery
# connector verifier. The vendor bearer token is embedded in the image.
mocksvc:
  image: registry.cn-shenzhen.aliyuncs.com/wl4g/e2e-customer-growth-mocksvc:e2e-local
  pullPolicy: Never
  # Pre-issued vendor bearer JWT; the CustomPrincipalDiscovery connector in
  # the Authguard config references the same value.
  bearerToken: e2e-mocksvc-directory-token
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

# SCIM background sync agent (Keycloak SCIM v2 API -> Authguard scim/refresh).
scimSync:
  image: registry.cn-shenzhen.aliyuncs.com/wl4g/e2e-customer-growth-scim-sync:e2e-local
  pullPolicy: Never
  # Long period: the E2E triggers an explicit job from the CronJob instead.
  schedule: "0 3 * * *"
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

authguard:
  grpcTarget: ""
  grpcTLS: false
  adminToken: e2e-admin-token
  accessContext:
    secretName: ""
    key: hmac-key
    signingKey: e2e-access-context-hmac-key-32-bytes-minimum

workloads:
  go-sqlx:
    host: e2e-go-sqlx.customer-growth.local
    schema: e2e_customer_growth_go_sqlx
    databaseUsername: e2e_customer_growth_go_sqlx
    databasePassword: e2e-customer-growth-go-sqlx-password
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/e2e-customer-growth-go-sqlx:e2e-local
    pullPolicy: Never
    resources:
      requests: { cpu: 25m, memory: 48Mi }
      limits: { cpu: 500m, memory: 256Mi }
  rust-sqlx:
    host: e2e-rust-sqlx.customer-growth.local
    schema: e2e_customer_growth_rust_sqlx
    databaseUsername: e2e_customer_growth_rust_sqlx
    databasePassword: e2e-customer-growth-rust-sqlx-password
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/e2e-customer-growth-rust-sqlx:e2e-local
    pullPolicy: Never
    resources:
      requests: { cpu: 25m, memory: 48Mi }
      limits: { cpu: 500m, memory: 256Mi }
  python-sqlalchemy:
    host: e2e-python-sqlalchemy.customer-growth.local
    schema: e2e_customer_growth_python_sqlalchemy
    databaseUsername: e2e_customer_growth_python_sqlalchemy
    databasePassword: e2e-customer-growth-python-sqlalchemy-password
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/e2e-customer-growth-python-sqlalchemy:e2e-local
    pullPolicy: Never
    resources:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { cpu: 500m, memory: 384Mi }
  spring-jdbc:
    host: e2e-spring-jdbc.customer-growth.local
    schema: e2e_customer_growth_spring_jdbc
    databaseUsername: e2e_customer_growth_spring_jdbc
    databasePassword: e2e-customer-growth-spring-jdbc-password
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/e2e-customer-growth-spring-jdbc:e2e-local
    pullPolicy: Never
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 768Mi }
  spring-jpa:
    host: e2e-spring-jpa.customer-growth.local
    schema: e2e_customer_growth_spring_jpa
    databaseUsername: e2e_customer_growth_spring_jpa
    databasePassword: e2e-customer-growth-spring-jpa-password
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/e2e-customer-growth-spring-jpa:e2e-local
    pullPolicy: Never
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 768Mi }
