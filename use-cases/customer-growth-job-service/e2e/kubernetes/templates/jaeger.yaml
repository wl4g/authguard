{{- if .Values.jaeger.enabled -}}
{{- $name := include "customer-growth-e2e.jaegerName" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "customer-growth-e2e.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2e-jaeger
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: e2e-jaeger
  ports:
    - name: otlp-grpc
      appProtocol: grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      appProtocol: http
      port: 4318
      targetPort: otlp-http
    - name: query-http
      appProtocol: http
      port: 16686
      targetPort: query-http
    - name: admin-http
      appProtocol: http
      port: 14269
      targetPort: admin-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "customer-growth-e2e.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2e-jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: e2e-jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: e2e-jaeger
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: jaeger
          image: {{ .Values.jaeger.image | quote }}
          imagePullPolicy: {{ .Values.jaeger.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
            - { name: SPAN_STORAGE_TYPE, value: "memory" }
            - { name: MEMORY_MAX_TRACES, value: {{ .Values.jaeger.memoryMaxTraces | quote }} }
            - { name: OTEL_TRACES_SAMPLER, value: "always_off" }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: query-http, containerPort: 16686 }
            - { name: admin-http, containerPort: 14269 }
          startupProbe:
            httpGet: { path: /, port: admin-http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: admin-http }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /, port: admin-http }
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.jaeger.resources | nindent 12 }}
{{- end }}
