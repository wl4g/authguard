{{- $name := include "customer-growth-e2e.postgresqlName" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-fixture
  labels:
    {{- include "customer-growth-e2e.labels" . | nindent 4 }}
data:
  init.sql: |
{{ required "postgresql.initSQL must contain the shared database fixture" .Values.postgresql.initSQL | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-credentials
  labels:
    {{- include "customer-growth-e2e.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-username: {{ .Values.postgresql.adminUsername | quote }}
  admin-password: {{ .Values.postgresql.adminPassword | quote }}
  superuser-password: {{ .Values.postgresql.superuserPassword | quote }}
  {{- range $component, $workload := .Values.workloads }}
  {{ $component }}-username: {{ $workload.databaseUsername | quote }}
  {{ $component }}-password: {{ $workload.databasePassword | quote }}
  {{ $component }}-schema: {{ $workload.schema | quote }}
  {{- if hasPrefix "spring-" $component }}
  {{ $component }}-url: {{ printf "jdbc:postgresql://%s.%s.svc.cluster.local:5432/%s?sslmode=disable&currentSchema=%s" $name $.Release.Namespace $.Values.postgresql.database $workload.schema | quote }}
  {{- else }}
  {{ $component }}-url: {{ printf "postgresql://%s:%s@%s.%s.svc.cluster.local:5432/%s?sslmode=disable&options=-csearch_path%%3D%s" $workload.databaseUsername $workload.databasePassword $name $.Release.Namespace $.Values.postgresql.database $workload.schema | quote }}
  {{- end }}
  {{- end }}
  10-e2e-init.sh: |
    #!/bin/bash
    set -euo pipefail
    export PGPASSWORD="${POSTGRESQL_POSTGRES_PASSWORD}"
    {{- range $component, $workload := .Values.workloads }}
    psql --host=127.0.0.1 --username=postgres --dbname="${POSTGRESQL_DATABASE}" \
      --set=ON_ERROR_STOP=1 \
      --set=role_name={{ $workload.databaseUsername | quote }} \
      --set=role_password={{ $workload.databasePassword | quote }} \
      --set=schema_name={{ $workload.schema | quote }} <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'role_name', :'role_password')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role_name') \gexec
    SELECT format('ALTER ROLE %I PASSWORD %L', :'role_name', :'role_password') \gexec
    SELECT format('CREATE SCHEMA IF NOT EXISTS %I AUTHORIZATION %I', :'schema_name', :'role_name') \gexec
    SELECT format('ALTER ROLE %I IN DATABASE %I SET search_path = %I', :'role_name', current_database(), :'schema_name') \gexec
    SQL
    PGPASSWORD={{ $workload.databasePassword | quote }} PGOPTIONS={{ printf "-c search_path=%s" $workload.schema | quote }} \
      psql --host=127.0.0.1 --username={{ $workload.databaseUsername | quote }} \
      --dbname="${POSTGRESQL_DATABASE}" --set=ON_ERROR_STOP=1 --file=/e2e-fixture/init.sql
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "customer-growth-e2e.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2e-postgresql
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: e2e-postgresql
  ports:
    - { name: postgresql, port: 5432, targetPort: postgresql }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "customer-growth-e2e.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2e-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: e2e-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: e2e-postgresql
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.postgresql.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - { name: POSTGRESQL_USERNAME, valueFrom: { secretKeyRef: { name: {{ $name }}-credentials, key: admin-username } } }
            - { name: POSTGRESQL_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $name }}-credentials, key: admin-password } } }
            - { name: POSTGRESQL_POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $name }}-credentials, key: superuser-password } } }
            - { name: POSTGRESQL_DATABASE, value: {{ .Values.postgresql.database | quote }} }
          ports:
            - { name: postgresql, containerPort: 5432 }
          startupProbe:
            exec: { command: ["bash", "-ec", "PGPASSWORD=$POSTGRESQL_PASSWORD pg_isready -U $POSTGRESQL_USERNAME -d $POSTGRESQL_DATABASE"] }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["bash", "-ec", "PGPASSWORD=$POSTGRESQL_PASSWORD pg_isready -U $POSTGRESQL_USERNAME -d $POSTGRESQL_DATABASE"] }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /bitnami/postgresql }
            - { name: fixture, mountPath: /e2e-fixture/init.sql, subPath: init.sql, readOnly: true }
            - { name: credentials, mountPath: /docker-entrypoint-initdb.d/10-e2e-init.sh, subPath: 10-e2e-init.sh, readOnly: true }
      volumes:
        - name: data
          emptyDir: {}
        - name: fixture
          configMap: { name: {{ $name }}-fixture }
        - name: credentials
          secret:
            secretName: {{ $name }}-credentials
            defaultMode: 0550
