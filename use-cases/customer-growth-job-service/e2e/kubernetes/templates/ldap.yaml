{{- if .Values.ldap.enabled -}}
{{- $name := include "customer-growth-e2e.ldapName" . -}}
{{- $secretName := include "customer-growth-e2e.keycloakSecretName" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "customer-growth-e2e.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2e-ldap
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: e2e-ldap
  ports:
    - { name: ldap, port: 389, targetPort: ldap }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "customer-growth-e2e.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2e-ldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: e2e-ldap
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: e2e-ldap
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ldap
          image: {{ .Values.ldap.image | quote }}
          imagePullPolicy: {{ .Values.ldap.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          ports:
            - { name: ldap, containerPort: 389 }
          startupProbe:
            tcpSocket: { port: ldap }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: ldap }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket: { port: ldap }
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.ldap.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config/config.cfg
              subPath: ldap-config.cfg
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: {{ $secretName }}
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
{{- end }}
