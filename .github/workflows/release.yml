name: Release

on:
  push:
    branches: [main]

concurrency:
  group: authguard-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          head_tag=$(git tag --points-at HEAD -l 'v[0-9]*' --sort=-v:refname | head -1)
          if [[ -n "${head_tag}" ]]; then
            echo "version=${head_tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${head_tag}" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          latest=${latest:-v0.0.0}
          version=${latest#v}
          IFS=. read -r major minor patch <<< "${version}"
          subject=$(git log -1 --format=%s)
          body=$(git log -1 --format=%B)
          if [[ "${subject}" =~ ^[^:]+!: ]] || grep -q "BREAKING CHANGE" <<< "${body}"; then
            major=$((major + 1)); minor=0; patch=0
          elif [[ "${subject}" == feat:* ]]; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"

      - name: Tag release commit
        if: steps.version.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shenzhen.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/wl4g/authguard:${{ steps.version.outputs.version }}
            ghcr.io/wl4g/authguard:latest
            registry.cn-shenzhen.aliyuncs.com/wl4g/authguard:${{ steps.version.outputs.version }}
            registry.cn-shenzhen.aliyuncs.com/wl4g/authguard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Package, publish, and pull-verify chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GH_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          mkdir -p dist verify
          helm dependency list deploy/helm/authguard
          helm lint deploy/helm/authguard
          helm package deploy/helm/authguard --destination dist --version "${VERSION}" --app-version "${VERSION}"
          helm push "dist/authguard-${VERSION}.tgz" oci://ghcr.io/wl4g/charts
          helm pull oci://ghcr.io/wl4g/charts/authguard --version "${VERSION}" --destination verify
          helm show chart "verify/authguard-${VERSION}.tgz" >/dev/null

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/authguard-${{ steps.version.outputs.version }}.tgz
