name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: authguard-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Update release comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHGUARD_PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHGUARD_COMMENT_KIND: release
          AUTHGUARD_COMMENT_PHASE: started
          AUTHGUARD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/upsert-pr-status-comment.mjs

      - name: Determine release version
        id: version
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if grep -qiE '^refactor:' <<< "${PR_TITLE}"; then
            bump=major
          elif grep -qiE '^feat:' <<< "${PR_TITLE}"; then
            bump=minor
          elif grep -qiE '^fix:' <<< "${PR_TITLE}"; then
            bump=patch
          else
            echo "PR title does not trigger a release (only refactor:, feat:, fix:)."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_tag=$(git tag --points-at HEAD -l 'v[0-9]*' --sort=-v:refname | head -1)
          if [[ -n "${head_tag}" ]]; then
            echo "version=${head_tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${head_tag}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "${bump}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Tag release commit
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Release tag ${TAG} already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

  publish:
    name: Publish official artifacts
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: AUTHGUARD_CARGO_FEATURES=web3
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.merge_commit_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          tags: |
            ghcr.io/wl4g/authguard:${{ needs.prepare.outputs.version }}
            ghcr.io/wl4g/authguard:latest
          cache-from: type=gha,scope=authguard-runtime
          cache-to: type=gha,mode=max,scope=authguard-runtime,ignore-error=true

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.merge_commit_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          tags: |
            ghcr.io/wl4g/authguard-web:${{ needs.prepare.outputs.version }}
            ghcr.io/wl4g/authguard-web:latest
          cache-from: type=gha,scope=authguard-web
          cache-to: type=gha,mode=max,scope=authguard-web,ignore-error=true

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Package, publish, and pull-verify chart
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GH_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          mkdir -p dist verify
          helm dependency list deploy/helm/authguard
          helm lint deploy/helm/authguard
          helm package deploy/helm/authguard --destination dist --version "${VERSION}" --app-version "${VERSION}"
          helm push "dist/authguard-${VERSION}.tgz" oci://ghcr.io/wl4g/charts
          helm pull oci://ghcr.io/wl4g/charts/authguard --version "${VERSION}" --destination verify
          helm show chart "verify/authguard-${VERSION}.tgz" >/dev/null

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: dist/authguard-${{ needs.prepare.outputs.version }}.tgz

  cleanup-dirty-images:
    name: Clean merged PR dirty images
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Delete all dirty images produced by this PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/cleanup-ghcr-dirty-images.sh \
            "${GITHUB_REPOSITORY}" \
            "${{ github.event.pull_request.number }}" \
            "${GITHUB_REPOSITORY_OWNER}" \
            authguard authguard-web

  comment-final:
    name: Report release result
    needs: [prepare, publish, cleanup-dirty-images]
    if: always() && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Update release comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHGUARD_PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHGUARD_COMMENT_KIND: release
          AUTHGUARD_COMMENT_PHASE: final
          AUTHGUARD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTHGUARD_PREPARE_RESULT: ${{ needs.prepare.result }}
          AUTHGUARD_RELEASE_RESULT: ${{ needs.publish.result }}
          AUTHGUARD_SHOULD_RELEASE: ${{ needs.prepare.outputs.should_release }}
          AUTHGUARD_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          AUTHGUARD_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node .github/scripts/upsert-pr-status-comment.mjs
