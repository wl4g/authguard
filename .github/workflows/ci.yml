name: Pull Request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: authguard-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      packages: write
      pull-requests: write
    outputs:
      dirty_tag: ${{ steps.dirty-tag.outputs.value }}
      dirty_chart_version: ${{ steps.dirty-tag.outputs.chart_version }}
    steps:
      - name: Reclaim ephemeral runner disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Update PR CI comment
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHGUARD_PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHGUARD_COMMENT_KIND: ci
          AUTHGUARD_COMMENT_PHASE: started
          AUTHGUARD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/upsert-pr-status-comment.mjs || \
            echo "::warning title=AuthGuard PR CI comment::Could not publish the CI status comment."

      - name: Derive immutable dirty tag
        id: dirty-tag
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short_sha="${HEAD_SHA:0:8}"
          base_chart_version=$(awk '/^version:/ { print $2; exit }' deploy/helm/authguard/Chart.yaml)
          test -n "${base_chart_version}"
          echo "value=dirty-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${base_chart_version}-dirty.${short_sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dirty runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          build-args: AUTHGUARD_CARGO_FEATURES=web3
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=${{ steps.dirty-tag.outputs.value }}
          tags: ghcr.io/wl4g/authguard:${{ steps.dirty-tag.outputs.value }}
          cache-from: type=gha,scope=authguard-runtime
          cache-to: type=gha,mode=max,scope=authguard-runtime,ignore-error=true

      - name: Build and push dirty web image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=${{ steps.dirty-tag.outputs.value }}
          tags: ghcr.io/wl4g/authguard-web:${{ steps.dirty-tag.outputs.value }}
          cache-from: type=gha,scope=authguard-web
          cache-to: type=gha,mode=max,scope=authguard-web,ignore-error=true

      - name: Drop package credentials before tests
        run: docker logout ghcr.io

      - name: Install pinned Rust toolchain
        run: cargo --version

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: |
            src/adapters/golang/go.sum
            use-cases/customer-growth-job-service/e2e/deploy/golang-sqlx-service/go.sum

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Run unit and integration matrix
        run: make test

      - name: Package dirty Helm chart
        env:
          CHART_VERSION: ${{ steps.dirty-tag.outputs.chart_version }}
          DIRTY_TAG: ${{ steps.dirty-tag.outputs.value }}
        run: |
          mkdir -p dist
          helm lint deploy/helm/authguard
          helm package deploy/helm/authguard \
            --destination dist \
            --version "${CHART_VERSION}" \
            --app-version "${DIRTY_TAG}"
          helm show chart "dist/authguard-${CHART_VERSION}.tgz" >/dev/null

      - name: Upload dirty Helm chart
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: authguard-chart-${{ steps.dirty-tag.outputs.value }}
          path: dist/authguard-${{ steps.dirty-tag.outputs.chart_version }}.tgz
          if-no-files-found: error
          retention-days: 14

  comment-build:
    name: Report build result
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Update PR CI comment
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHGUARD_PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHGUARD_COMMENT_KIND: ci
          AUTHGUARD_COMMENT_PHASE: build
          AUTHGUARD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTHGUARD_BUILD_RESULT: ${{ needs.build-and-test.result }}
          AUTHGUARD_DIRTY_TAG: ${{ needs.build-and-test.outputs.dirty_tag }}
          AUTHGUARD_DIRTY_CHART_VERSION: ${{ needs.build-and-test.outputs.dirty_chart_version }}
        run: |
          node .github/scripts/upsert-pr-status-comment.mjs || \
            echo "::warning title=AuthGuard PR CI comment::Could not publish the CI status comment."

  e2e-kubernetes:
    name: Full customer-growth Kubernetes E2E
    needs: build-and-test
    # Set the repository/org variable AUTHGUARD_E2E_RUNNER for a larger or
    # self-hosted runner when the default GitHub-hosted capacity is insufficient.
    runs-on: ${{ vars.AUTHGUARD_E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    outputs:
      summary_base64: ${{ steps.summary.outputs.base64 }}
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      AUTHGUARD_E2E_USE_PREBUILT_IMAGES: "true"
      AUTHGUARD_E2E_AUTHGUARD_IMAGE: ghcr.io/wl4g/authguard:${{ needs.build-and-test.outputs.dirty_tag }}
      AUTHGUARD_E2E_WEB_IMAGE: ghcr.io/wl4g/authguard-web:${{ needs.build-and-test.outputs.dirty_tag }}
    steps:
      - name: Reclaim ephemeral runner disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned Rust toolchain
        run: cargo --version

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Install k3s
        run: |
          curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644
          kubectl wait --for=condition=Ready node --all --timeout=180s

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install browser runtime
        run: |
          make e2e-python
          use-cases/customer-growth-job-service/e2e/.venv/bin/python \
            -m playwright install --with-deps chromium

      - name: Run complete E2E matrix against dirty images
        run: make e2e-k8s E2E_K8S_ARGS=--cleanup-after-run

      - name: Capture E2E summary
        id: summary
        if: always()
        run: |
          summary=use-cases/customer-growth-job-service/e2e/reports/00_summary.md
          if [[ -s "${summary}" ]]; then
            echo "base64=$(base64 -w 0 "${summary}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-growth-e2e-kubernetes-${{ needs.build-and-test.outputs.dirty_tag }}
          path: use-cases/customer-growth-job-service/e2e/reports/
          if-no-files-found: warn
          retention-days: 14

  e2e-docker:
    name: Full customer-growth Docker Compose E2E
    needs: build-and-test
    # Keep the two backends on separate runner VMs; never serialize their
    # container, browser, database, Keycloak, and Solana resource peaks.
    runs-on: ${{ vars.AUTHGUARD_E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    outputs:
      summary_base64: ${{ steps.summary.outputs.base64 }}
    env:
      AUTHGUARD_E2E_USE_PREBUILT_IMAGES: "true"
      AUTHGUARD_E2E_AUTHGUARD_IMAGE: ghcr.io/wl4g/authguard:${{ needs.build-and-test.outputs.dirty_tag }}
      AUTHGUARD_E2E_WEB_IMAGE: ghcr.io/wl4g/authguard-web:${{ needs.build-and-test.outputs.dirty_tag }}
    steps:
      - name: Reclaim ephemeral runner disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned Rust toolchain
        run: cargo --version

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Docker Compose
        run: docker compose version

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install browser runtime
        run: |
          make e2e-python
          use-cases/customer-growth-job-service/e2e/.venv/bin/python \
            -m playwright install --with-deps chromium

      - name: Run complete Docker Compose E2E matrix against dirty images
        run: make e2e-docker E2E_DOCKER_ARGS=--cleanup-after-run

      - name: Capture Docker Compose E2E summary
        id: summary
        if: always()
        run: |
          summary=use-cases/customer-growth-job-service/e2e/reports/00_summary.md
          if [[ -s "${summary}" ]]; then
            echo "base64=$(base64 -w 0 "${summary}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Docker Compose E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-growth-e2e-docker-${{ needs.build-and-test.outputs.dirty_tag }}
          path: use-cases/customer-growth-job-service/e2e/reports/
          if-no-files-found: warn
          retention-days: 14

  comment-final:
    name: Report PR CI result
    needs: [build-and-test, comment-build, e2e-kubernetes, e2e-docker]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Update PR CI comment
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHGUARD_PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHGUARD_COMMENT_KIND: ci
          AUTHGUARD_COMMENT_PHASE: final
          AUTHGUARD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTHGUARD_BUILD_RESULT: ${{ needs.build-and-test.result }}
          AUTHGUARD_E2E_KUBERNETES_RESULT: ${{ needs.e2e-kubernetes.result }}
          AUTHGUARD_E2E_KUBERNETES_SUMMARY_BASE64: ${{ needs.e2e-kubernetes.outputs.summary_base64 }}
          AUTHGUARD_E2E_DOCKER_RESULT: ${{ needs.e2e-docker.result }}
          AUTHGUARD_E2E_DOCKER_SUMMARY_BASE64: ${{ needs.e2e-docker.outputs.summary_base64 }}
          AUTHGUARD_DIRTY_TAG: ${{ needs.build-and-test.outputs.dirty_tag }}
          AUTHGUARD_DIRTY_CHART_VERSION: ${{ needs.build-and-test.outputs.dirty_chart_version }}
        run: |
          node .github/scripts/upsert-pr-status-comment.mjs || \
            echo "::warning title=AuthGuard PR CI comment::Could not publish the CI status comment."
