  <text x="1147" y="583" font-size="14" fill="#b6d8aa" font-weight="650" text-anchor="middle">13</text>
  <text x="1128" y="888" font-size="15" fill="#e9b681" font-weight="400" text-anchor="start">Native credentials</text>
  <text x="650" y="1158" font-size="15" fill="#e9b681" font-weight="400" text-anchor="start">ServiceAccount native I/O (outside Authguard)</text>
  <rect x="30" y="1190" width="22" height="18" rx="3" fill="#203c2a" stroke="#b6d8aa" stroke-width="1.7"/>
  <text x="62" y="1205" font-size="16" fill="#b6d8aa" font-weight="600" text-anchor="start">Authguard Control</text>
  <text x="62" y="1230" font-size="15" fill="#b6d8aa" font-weight="400" text-anchor="start">(filter &amp; SDK enforcement)</text>
  <rect x="500" y="1190" width="22" height="18" rx="3" fill="#252f47" stroke="#b8c4ed" stroke-width="1.7"/>
  <text x="532" y="1205" font-size="16" fill="#b8c4ed" font-weight="600" text-anchor="start">Authguard Related External Interaction</text>
  <text x="532" y="1230" font-size="15" fill="#b8c4ed" font-weight="400" text-anchor="start">(corporate central auth source)</text>
  <rect x="990" y="1190" width="22" height="18" rx="3" fill="#3d2c21" stroke="#e9b681" stroke-width="1.7"/>
  <text x="1022" y="1205" font-size="16" fill="#e9b681" font-weight="600" text-anchor="start">Outside Authguard (Non-Control)</text>
  <text x="1022" y="1230" font-size="15" fill="#e9b681" font-weight="400" text-anchor="start">(controlled by each middleware component)</text>
  <text x="30" y="1270" font-size="15" fill="#bdd0bf" font-weight="400" text-anchor="start">PEP (Policy Enforcement Point) / PDP (Policy Decision Point) / JIT (Just-in-Time provisioning) / DSP (Digital Security Platform)</text>
  <text x="30" y="1295" font-size="14" fill="#bdd0bf" font-weight="400" text-anchor="start">PEP enforces access / PDP evaluates policy / JIT resolves or creates identity after proof.</text>
  <text x="30" y="1322" font-size="14" fill="#bdd0bf" font-weight="400" text-anchor="start">R (Read) includes an API check before SDK row filtering.</text>
</svg>
