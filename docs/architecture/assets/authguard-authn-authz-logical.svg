  <text x="30" y="43" font-size="30" fill="#f0f1df" font-weight="700" text-anchor="start">Authguard - logical overview</text>
  <text x="30" y="76" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">Identity proof, API decisions and data enforcement (number groups match the physical view).</text>
  <text x="370" y="310" font-size="18" fill="#b6d8aa" font-weight="600" text-anchor="start">1 Authguard (deploy / configure)</text>
  <text x="968" y="141" font-size="21" fill="#b8c4ed" font-weight="650" text-anchor="start">Corporate Central Identity / Policy sources</text>
  <text x="968" y="170" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">LDAP / DSP / Keycloak</text>
  <text x="968" y="194" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">Identity / group facts</text>
  <text x="968" y="218" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">(verification / discover / SCIM)</text>
  <text x="48" y="461" font-size="21" fill="#b8c4ed" font-weight="650" text-anchor="start">User / ServiceAccount</text>
  <text x="48" y="490" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">UI / Business API (workload)</text>
  <text x="48" y="514" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">(cookie / bearer token)</text>
  <text x="418" y="461" font-size="21" fill="#b6d8aa" font-weight="650" text-anchor="start">Envoy Gateway (PEP)</text>
  <text x="418" y="490" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">JWT check / routing</text>
  <text x="418" y="514" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">Enforce allow / deny</text>
  <text x="758" y="361" font-size="21" fill="#b6d8aa" font-weight="650" text-anchor="start">AuthN</text>
  <text x="758" y="390" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">Local Credentials / redirect IdP verify</text>
  <text x="758" y="414" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">Identity -&gt; JWT</text>
  <text x="758" y="438" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">(JIT linking canonical principal after)</text>
  <text x="758" y="761" font-size="21" fill="#b6d8aa" font-weight="650" text-anchor="start">AuthZ</text>
  <text x="758" y="790" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">CRUD: Action checks by URNs scope</text>
  <text x="758" y="814" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">(filtering by http 5 tuples)</text>
  <text x="758" y="838" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">Management / discover / SCIM</text>
  <text x="48" y="761" font-size="21" fill="#b8c4ed" font-weight="650" text-anchor="start">Admin UI</text>
  <text x="48" y="790" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">Discover -&gt; save -&gt; grant</text>
  <text x="48" y="814" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">(management API)</text>
  <text x="1158" y="461" font-size="21" fill="#b8c4ed" font-weight="650" text-anchor="start">Business MicroServices</text>
  <text x="1158" y="490" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">HTTP APIs (R / CUD)</text>
  <text x="1178" y="581" font-size="21" fill="#b6d8aa" font-weight="650" text-anchor="start">Authguard SDK</text>
  <text x="1178" y="610" font-size="13" fill="#bdd0bf" font-weight="400" text-anchor="start">R: URNs -&gt; Query SQL WHERE</text>
  <text x="1178" y="634" font-size="13" fill="#bdd0bf" font-weight="400" text-anchor="start">CUD: URNs -&gt; Update SQL WHERE</text>
  <text x="1178" y="658" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">(resources PEP)</text>
  <text x="418" y="1021" font-size="21" fill="#b6d8aa" font-weight="650" text-anchor="start">Authguard State (DB / Redis)</text>
  <text x="418" y="1050" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">Identity / policy / transient state</text>
  <text x="418" y="1074" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">(shared by AuthN and AuthZ)</text>
  <text x="1158" y="941" font-size="21" fill="#e9b681" font-weight="650" text-anchor="start">Native AuthN / AuthZ</text>
  <text x="1158" y="970" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">(outside Authguard)</text>
  <text x="1158" y="994" font-size="14" fill="#bdd0bf" font-weight="400" text-anchor="start">PG / Airflow / Kafka / Redis / S3 ...</text>
  <text x="1158" y="1018" font-size="17" fill="#bdd0bf" font-weight="400" text-anchor="start">Cloud IAM (native grants)</text>
