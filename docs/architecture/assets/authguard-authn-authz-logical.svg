<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1350" viewBox="0 0 1440 1350" role="img" aria-labelledby="title desc">
  <title id="title">Authguard logical overview</title>
  <desc id="desc">A compact logical view precedes the detailed physical diagram. Gateway routes authentication to AuthN and protected API checks to AuthZ. AuthN verifies credentials, IdP exchanges or signing proofs, then resolves canonical identity through JIT/account linking and issues JWTs. AuthZ checks CUD actions/targets and read API admission/scope. Gateway forwards business traffic directly to business services; embedded SDKs compile read scope into SQL WHERE and apply mutation guards. Corporate sources support discovery and SCIM lifecycle facts. State combines IAM DB and Redis conceptually. Native authentication/authorization is independent. Number groups reference the physical view.</desc>
  <metadata>Authguard logical architecture; 2026-11-15; Apache-2.0. Overview; detailed calls and implementation gaps are specified separately.</metadata>
