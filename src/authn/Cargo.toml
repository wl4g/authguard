[package]
name = "authguard-authn"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
web3 = [
  "dep:alloy",
  "dep:bitcoin",
  "dep:bip322",
  "dep:bs58",
  "dep:hex",
  "dep:siwx",
  "dep:siwx-evm",
  "dep:siwx-svm",
  "dep:time",
]

[dependencies]
aes-gcm.workspace = true
alloy = { workspace = true, optional = true, features = ["reqwest-rustls-tls"] }
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
authguard-common = { workspace = true, features = ["redis-cache"] }
axum.workspace = true
base64.workspace = true
bitcoin = { workspace = true, optional = true }
bip322 = { workspace = true, optional = true }
bs58 = { workspace = true, optional = true }
chrono.workspace = true
hex = { workspace = true, optional = true }
openidconnect.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
siwx = { workspace = true, optional = true }
siwx-evm = { workspace = true, optional = true }
siwx-svm = { workspace = true, optional = true }
thiserror.workspace = true
time = { workspace = true, optional = true }
tokio.workspace = true
totp-rs.workspace = true
tracing.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true

[lints]
workspace = true
