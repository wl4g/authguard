# =============================================================================
#  GLAuth configuration for the Authguard IT test directory.
#
#  DIT shape: glauth nests users under ou=users/{primary-group} and groups
#  under ou=groups (the `groupformat` ou), both below dc=example,dc=com.
#  Users carry cn/mail/accountStatus; groups under ou=groups carry ou as
#  their identity attribute. The service identity cn=svc-authguard is the
#  bind DN used by the LDAP discovery connector.
# =============================================================================

[ldap]
  enabled = true
  listen = "0.0.0.0:389"

[ldaps]
  enabled = false

[behaviors]
  IgnoreCapabilities = true

[backend]
  datastore = "config"
  baseDN = "dc=example,dc=com"
  nameformat = "cn"
  groupformat = "ou"

# ── Service bind identity ─────────────────────────────────────────
[[users]]
  name = "svc-authguard"
  givenname = "Authguard"
  sn = "Service"
  mail = "svc-authguard@example.com"
  uidnumber = 5000
  primarygroup = 5503
  passsha256 = "ef92b778bafe771e89245b89ecbc08a44a4e166c06659911881f383d4473e94f"  # "password123"
  othergroups = [5503]

# ── People ────────────────────────────────────────────────────────
[[users]]
  name = "jdoe"
  givenname = "John"
  sn = "Doe"
  mail = "jdoe@example.com"
  uidnumber = 1001
  primarygroup = 5501
  passsha256 = "ef92b778bafe771e89245b89ecbc08a44a4e166c06659911881f383d4473e94f"  # "password123"
  othergroups = [5501]
  attrs = { department = "Engineering" }

[[users]]
  name = "asmith"
  givenname = "Alice"
  sn = "Smith"
  mail = "asmith@example.com"
  uidnumber = 1002
  primarygroup = 5502
  passsha256 = "ef92b778bafe771e89245b89ecbc08a44a4e166c06659911881f383d4473e94f"  # "password123"
  othergroups = [5502]
  attrs = { department = "Sales" }

[[users]]
  name = "bwilson"
  givenname = "Bob"
  sn = "Wilson"
  mail = "bwilson@example.com"
  uidnumber = 1003
  primarygroup = 5503
  passsha256 = "ef92b778bafe771e89245b89ecbc08a44a4e166c06659911881f383d4473e94f"  # "password123"
  othergroups = []

# ── Groups ─────────────────────────────────────────────────────────
[[groups]]
  name = "Engineering"
  gidnumber = 5501
  description = "Engineering"

[[groups]]
  name = "Sales"
  gidnumber = 5502
  description = "Sales"

[[groups]]
  name = "Users"
  gidnumber = 5503
  description = "Default user group"
