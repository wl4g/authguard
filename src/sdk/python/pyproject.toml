[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authguard-sdk"
version = "0.1.0"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sdk", "sdk.*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
